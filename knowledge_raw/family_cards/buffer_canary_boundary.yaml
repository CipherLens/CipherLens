id: buffer_canary_boundary
framework_family: buffer_canary_boundary
card_type: framework_family
status: partial
description: caller-provided buffer, explicit length, truncation, overwrite, out-of-bounds write, underflow,
  or canary-after-buffer boundary behavior
harness_shape:
  input_kind: caller_buffer_or_sized_field
  trigger: boundary length or sized field mutation
  observables:
  - return_code
  - canary_state
  - sanitizer_signal
  - written_length
input_model: caller-provided buffer, serialized field, or length-prefixed byte sequence
mutation_slots:
- boundary_length
- truncation
- padding_length
- output_buffer_size
- serialized_value_size
oracle_contract:
  oracle_type: buffer_boundary_oracle
  pass_condition: valid size succeeds without canary or sanitizer signal
  candidate_condition: mutation corrupts canary, writes out of bounds, or reports unsafe length
  safe_reject_condition: invalid size is rejected or truncated safely
  unsupported_condition: target API does not write to caller buffer or expose comparable size field
  blocked_condition: target runtime is blocked or required input construction is unavailable
triage_outputs:
- candidate_event
- semantic_gap_candidate
- semantic_observation
- safe_reject
- unsupported
- blocked
required_target_cards:
- api_card
- constraints
- call_sequence
- negative_feedback
- mapping_gate
