contract:
  input_kind: DER buffer pointer with explicit byte length
  return_semantics: returns WOLFSSL_X509 pointer on parse success and NULL on parse failure
  consumed_length_visibility:
    wolfSSL_d2i_X509: visible through caller-supplied const unsigned char ** pointer advancement
    wolfSSL_X509_d2i: not directly visible because the API takes a const byte pointer and length
  pointer_advancement_behavior: wolfSSL_d2i_X509 advances the caller-supplied input pointer by the parsed certificate length on success
  full_consumption_guardrail: full-buffer acceptance must be checked by computing consumed = p - input and requiring consumed == input_len; object return alone is not sufficient
  ownership: successful parse returns a WOLFSSL_X509 object owned by the caller
  cleanup_api: wolfSSL_X509_free
  malformed_der_behavior: malformed or unparseable DER is represented as NULL return through this pointer-return API
