notes:
  - >
    No local fix.patch file is present. The pattern uses fix_commits.txt,
    reproduction_result.md, the PoC source, and buggy/fixed logs as primary
    evidence.
  - >
    metadata.json contains broad CVE search evidence; the narrowed confirmed
    root cause is pem_check_pkcs_padding() reading input[input_len - 1] without
    an input_len < 1 guard.
