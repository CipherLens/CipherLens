  affected_file:
    - library/x509.c
    - library/x509_crt.c
    - library/x509_crl.c

classification:
  poc_type: parser_or_encoding
  bug_category: asn1_nested_substructure_boundary
  failure_signal:
    - differential_error_code
    - parser_crosses_inner_asn1_boundary
    - malformed_certificate_boundary_behavior

root_cause:
  summary: >
    In the buggy version, some X.509 ASN.1 parsing routines continue using the
    parent structure's end pointer while parsing nested substructures. This
    allows parsing inside an inner ASN.1 substructure to cross that
    substructure's boundary. The reproduced malformed certificate changes from
    an unexpected-tag path in the buggy version to an out-of-data boundary path
    in the fixed version.
  root_cause_location:
    file: library/x509.c
    function: x509_get_attr_type_value
    related_functions:
      - library/x509_crt.c:mbedtls_x509_get_crt_ext
      - library/x509_crl.c:mbedtls_x509_get_crl_ext
    branch_condition: "inner parser end should be set to *p + len"
  buggy_logic:
    - "nested ASN.1 parser keeps using parent end pointer"
    - "fields can be read across the inner AttributeTypeAndValue boundary"
    - "malformed zero-length inner structures reach the wrong parser error path"
  fixed_logic:
    - "end = *p + len;"
    - "if (*p != end) { return MBEDTLS_ERR_X509_INVALID_NAME + MBEDTLS_ERR_ASN1_LENGTH_MISMATCH; }"
    - "extension parsers return early when *p == end and update end to the inner extension boundary"
  critical_fixed_statement: "end = *p + len;"

trigger:
  input_format: DER_certificate
  public_api: mbedtls_x509_crt_parse_der
  malformed_structure: "TBSCertificate issuer with two empty inner AttributeTypeAndValue structures"
  expected_buggy_ret: -9186
  expected_fixed_ret: -9184
  description: >
    The PoC passes a regression-test-derived malformed DER certificate to
    mbedtls_x509_crt_parse_der(). The issuer contains empty nested ASN.1
    AttributeTypeAndValue structures. The buggy parser crosses the inner
    boundary and reports an unexpected tag; the fixed parser reports out of
    data at the inner boundary.

buggy_behavior:
  ret: -9186
  signal: parser_crossed_inner_boundary
  sample_output: "[BUG] buggy behavior: parser crossed inner ASN.1 substructure bounds."

fixed_behavior:
  ret: -9184
  signal: parser_obeyed_inner_boundary
  sample_output: "[OK] fixed behavior: parser obeyed inner ASN.1 substructure bounds."

mutation_points:
  - name: INNER_END_BOUND
    placeholder: "[INNER_END_BOUND]"
    mask_level: statement_level
    source_expr: "end = *p + len;"
    reason: >
      Updates the parser bound from the parent object to the current nested
      ASN.1 substructure.
    priority: high

  - name: TRAILING_INNER_DATA_CHECK
    placeholder: "[TRAILING_INNER_DATA_CHECK]"
    mask_level: block_level
    source_expr: "if (*p != end) { return MBEDTLS_ERR_X509_INVALID_NAME + MBEDTLS_ERR_ASN1_LENGTH_MISMATCH; }"
    reason: >
      Rejects data that remains after parsing the inner AttributeTypeAndValue
      sequence.
    priority: high

  - name: EMPTY_EXTENSION_RETURN
    placeholder: "[EMPTY_EXTENSION_RETURN]"
    mask_level: statement_level
    source_expr: "if (*p == end) return 0;"
    reason: >
      Prevents extension parsing from continuing past an empty nested
      extension structure.
    priority: medium

  - name: MALFORMED_DER_STRUCTURE
    placeholder: "[MALFORMED_DER_STRUCTURE]"
    mask_level: value_level
    source_expr: "DER issuer has two empty inner set datas / AttributeTypeAndValue structures"
    reason: >
      The malformed input triggers the parser-boundary difference.
    priority: high

occlusion_candidates:
  identifier_level:
    - end
    - len
    - "*p"
  expression_level:
    - "*p + len"
    - "*p != end"
    - "*p == end"
  statement_level:
    - "end = *p + len;"
    - "end = crt->v3_ext.p + crt->v3_ext.len;"
    - "end = ext->p + ext->len;"
  block_level:
    - "inner ASN.1 substructure boundary check"

vulnerability_path_features:
  must_preserve:
    - asn1_der_parser_entrypoint
    - nested_substructure_length_field
    - parent_end_vs_inner_end_boundary
    - malformed_nested_empty_structure
    - differential_parser_error_or_rejection_path
  optional:
    - x509_certificate_der
    - issuer_name_attribute_type_value
    - crt_extension_or_crl_extension_helpers
  not_required:
    - exact certificate bytes
    - exact numeric error code values
    - exact helper function names

oracle:
  oracle_type: differential_error_code_parser_boundary
  bug_signals:
    - ret_is_MBEDTLS_ERR_X509_INVALID_NAME_plus_MBEDTLS_ERR_ASN1_UNEXPECTED_TAG
    - parser_crossed_inner_asn1_substructure_bounds
  fixed_or_safe_signals:
    - ret_is_MBEDTLS_ERR_X509_INVALID_NAME_plus_MBEDTLS_ERR_ASN1_OUT_OF_DATA
    - parser_obeyed_inner_asn1_substructure_bounds

migration_guidance:
  good_target_api_features:
    - parses DER or ASN.1 nested structures
    - has explicit parent and child length/end boundaries
    - exposes differential error codes or parse failure classes
    - accepts malformed nested structures as harness input
  weak_or_missing_features:
    - parser flattens nested structures without observable inner-boundary errors
    - parser only returns a generic parse failure
    - no way to craft or feed DER-level malformed input
  migration_notes:
    - >
      This is a parser-boundary migration pattern. Preserve the inner
      substructure end pointer behavior rather than treating it as a generic
      malformed certificate case.

