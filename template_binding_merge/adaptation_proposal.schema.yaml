$schema: https://json-schema.org/draft/2020-12/schema
$id: cipherlens.adaptation_proposal.v0.1
title: CipherLens AdaptationProposal v0.1
type: object
additionalProperties: false
required: [schema_version, proposal_id, merge_ref, merge_digest, base_bound_source_ref, base_bound_source_digest, provider_provenance, epistemic_status, restricted_edits]
properties:
  schema_version: {const: cipherlens.adaptation_proposal.v0.1}
  proposal_id: {type: string}
  merge_ref: {type: string}
  merge_digest: {$ref: '#/$defs/sha256'}
  base_bound_source_ref: {type: string}
  base_bound_source_digest: {$ref: '#/$defs/sha256'}
  epistemic_status: {const: PROPOSED}
  provider_provenance:
    type: object
    additionalProperties: false
    required: [provider_id, provider_version, request_digest]
    properties: {provider_id: {type: string}, provider_version: {type: string}, request_digest: {$ref: '#/$defs/sha256'}}
  restricted_edits:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [edit_id, edit_type, hole_ref, base_source_digest, expected_syntax_kind, replacement]
      properties:
        edit_id: {type: string}
        edit_type: {enum: [FILL_HOLE, ADD_DECLARED_INCLUDE, INSERT_DECLARED_BOILERPLATE, REPLACE_DECLARED_EXPRESSION]}
        hole_ref: {type: string}
        base_source_digest: {$ref: '#/$defs/sha256'}
        expected_syntax_kind: {type: string}
        replacement: {type: string, minLength: 1}
$defs:
  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
