$schema: https://json-schema.org/draft/2020-12/schema
$id: cipherlens.bound_template_source.v0.1
title: CipherLens Bound Template Source v0.1
type: object
additionalProperties: false
required: [schema_version, bound_source_id, merge_ref, merge_digest, source_artifact_ref, source_digest, source_map_ref, source_map_digest, renderer_id, renderer_version, language, unresolved_hole_refs, build_spec_ref, build_spec_digest]
properties:
  schema_version: {const: cipherlens.bound_template_source.v0.1}
  bound_source_id: {type: string}
  merge_ref: {type: string}
  merge_digest: {$ref: '#/$defs/sha256'}
  source_artifact_ref: {type: string}
  source_digest: {$ref: '#/$defs/sha256'}
  source_map_ref: {type: string}
  source_map_digest: {$ref: '#/$defs/sha256'}
  renderer_id: {type: string}
  renderer_version: {type: string}
  language: {type: string}
  unresolved_hole_refs: {type: array, uniqueItems: true, items: {type: string}}
  build_spec_ref: {type: string}
  build_spec_digest: {$ref: '#/$defs/sha256'}
$defs:
  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
