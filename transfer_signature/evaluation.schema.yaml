schema_version: cipherlens.ts_evaluation.v0.1
document_kind: transfer_signature_evaluation
closed: true
required_top_level:
- schema_version
- signature_id
- profile_id
- constraint_results
- eligibility
- reason_codes
objects:
  constraint_result:
    required: [constraint_id, constraint_class, result, matched_fact_refs, reason_code, missing_fact_requirements]
    optional: []
constraint_results: [MATCH, MISMATCH, UNKNOWN]
eligibility: [ELIGIBLE, INELIGIBLE, INDETERMINATE]
constraint_classes:
- required_capability
- excluded_semantic
- required_observability
reason_codes:
- VERIFIED_COMPATIBLE_TRUE
- VERIFIED_COMPATIBLE_FALSE
- VERIFIED_EXCLUSION_PRESENT
- VERIFIED_EXCLUSION_ABSENT
- VERIFIED_CHANNEL_AVAILABLE
- VERIFIED_CHANNEL_UNAVAILABLE
- UNVERIFIED_COMPATIBLE_FACT
- NONDETERMINATE_COMPATIBLE_FACT
- NO_COMPATIBLE_FACT
missing_fact_requirements:
- COMPATIBLE_FACT
- VERIFIED_FACT
- SURFACE_NEGATIVE_FACT
- COMPATIBLE_SUBJECT
top_reason_codes:
- REQUIRED_CAPABILITY_MISMATCH
- REQUIRED_OBSERVABILITY_MISMATCH
- EXCLUDED_SEMANTIC_MATCH
- ALL_ELIGIBILITY_CONDITIONS_MET
- UNRESOLVED_CONSTRAINTS
