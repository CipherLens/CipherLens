schema: family_card_v1
family: evp_cipher_ctx_lifecycle
track: lifecycle
archetype: evp_context_lifecycle
target_library: openssl
component: EVP_CIPHER_CTX
summary: >
  EVP cipher context lifecycle seeds exercise init/update/final/reset/free state
  transitions for EVP_CIPHER_CTX using AES-128-CBC, without parser replay, DER
  trailing garbage, or full-consumption oracles.
primary_apis:
  - EVP_CIPHER_CTX_new
  - EVP_EncryptInit_ex
  - EVP_EncryptUpdate
  - EVP_EncryptFinal_ex
  - EVP_CIPHER_CTX_reset
  - EVP_CIPHER_CTX_free
  - EVP_aes_128_cbc
oracle:
  - unexpected_failure_on_valid_sequence
  - unexpected_success_after_invalid_state
  - state_transition_observation
  - crash_or_sanitizer
avoid_patterns:
  - der_single_object_trailing_garbage_full_consumption
  - secure_heap_state_lifecycle_issue_28669
  - x509_pkey_pkcs8_parsing
claim_policy:
  confirmed_vulnerability: false
  cve: false
  exploitable: false
