template_id: RSA_DER_TOP_LEVEL_SEQUENCE_TRAILING_GARBAGE
template_name: mbedtls RSA DER top-level SEQUENCE trailing-garbage template
source_api: mbedtls_pk_parse_key
trigger_apis:
- mbedtls_pk_parse_key
- mbedtls_rsa_parse_key
- mbedtls_rsa_parse_pubkey
- mbedtls_pk_parse_public_key
harness_family: der_pointer_consumption
selection_policy:
  method: ast_lite_high_value_mask_unit_selection
  rules:
  - Prefer role=mutation_point units.
  - Prefer mask_level=value or api_argument units.
  - Always retain trigger_call function_call/statement units.
  - Always retain oracle statement/block units.
  - Retain input_preparation/helper_function/block only when harness-family context
    keywords are present.
  - Use configured preferred_roles as scoring hints for each harness family.
  - Use configured oracle_variables to prioritize oracle-observable units.
  - Limit input/helper context to representative high-scoring units.
  - Limit cleanup units to one or two representative statements.
  - Deduplicate repeated code snippets.
  context_keywords:
  - DER
  - ASN1
  - ASN.1
  - SEQUENCE
  - trailing
  - TRAILING_GARBAGE
  - base_hex
  - der_len
  - consumed_len
  - p
  - ppin
  - p - der
  - end
  - len
  - parse_key
  - parse_pubkey
  - d2i
  - d2i_
  - select_base_der_hex
  - build_der_with_trailing_garbage
  family_rules_source: config/harness_family_ast_rules.yaml
  family_rule:
    context_keywords:
    - DER
    - ASN1
    - ASN.1
    - SEQUENCE
    - trailing
    - TRAILING_GARBAGE
    - base_hex
    - der_len
    - consumed_len
    - p
    - ppin
    - p - der
    - end
    - len
    - parse_key
    - parse_pubkey
    - d2i
    - d2i_
    - select_base_der_hex
    - build_der_with_trailing_garbage
    oracle_variables:
    - ret
    - consumed_len
    - der_len
    - p
    preferred_roles:
    - mutation_point
    - trigger_call
    - oracle
    - input_preparation
    - helper_function
    - cleanup
    context_limit: 12
    cleanup_limit: 2
