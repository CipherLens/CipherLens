template_id: WOLFSSL-FAMILY-pkcs_container_parsing
template_name: wolfssl family canonical template for pkcs_container_parsing
source_api: wc_PKCS12_parse
template_file: canonical_tmpl_wolfssl.c
template_library: wolfssl
trigger_apis:
- wc_PKCS12_parse
- wc_PKCS7_VerifySignedData
- wc_PKCS7_DecodeSignedData
- PKCS12_parse
- PKCS7_verify
- '[''wc_PKCS12_parse'', ''wc_PKCS7_VerifySignedData'', ''wc_PKCS7_DecodeSignedData'',
  ''PKCS12_parse'', ''PKCS7_verify'']'
harness_family: x509_asn1_inner_boundary
selection_policy:
  method: ast_lite_high_value_mask_unit_selection
  rules:
  - Prefer role=mutation_point units.
  - Prefer mask_level=value or api_argument units.
  - Always retain trigger_call function_call/statement units.
  - Always retain oracle statement/block units.
  - Retain input_preparation/helper_function/block only when harness-family context
    keywords are present.
  - Use configured preferred_roles as scoring hints for each harness family.
  - Use configured oracle_variables to prioritize oracle-observable units.
  - Limit input/helper context to representative high-scoring units.
  - Limit cleanup units to one or two representative statements.
  - Deduplicate repeated code snippets.
  context_keywords:
  - x509
  - X509
  - ASN1
  - ASN.1
  - asn1
  - der
  - DER
  - certificate
  - inner
  - boundary
  - d2i_X509
  - malformed
  ast_report_name: ast_mask_report.yaml
  family_rules_source: config/harness_family_ast_rules.yaml
  family_rule:
    context_keywords:
    - x509
    - X509
    - ASN1
    - ASN.1
    - asn1
    - der
    - DER
    - certificate
    - inner
    - boundary
    - d2i_X509
    - malformed
    oracle_variables:
    - ret
    - consumed_len
    - der_len
    trigger_functions: []
    oracle_functions: []
    preferred_roles:
    - mutation_point
    - trigger_call
    - oracle
    - input_preparation
    context_limit: 12
    cleanup_limit: 2
