template_id: EVP_MAC_GET_SIZE_UNINIT_LIFECYCLE
pattern_id: OPENSSL-ISSUE-22842
source_library: openssl
trigger_apis:
  - EVP_MAC_CTX_get_mac_size
  - EVP_MAC_init
harness_family: object_state_lifecycle

selected_units:
  - unit_id: mac_name_literal
    slot: MAC_NAME
    selected: true
    priority: high
    reason: MAC implementation selector controls EVP_MAC_fetch

  - unit_id: digest_name_literal
    slot: DIGEST_NAME
    selected: true
    priority: high
    reason: digest controls initialized MAC size

  - unit_id: key_bytes_literal
    slot: KEY_BYTES
    selected: true
    priority: medium
    reason: HMAC key bytes for post-init setup

  - unit_id: key_len_argument
    slot: KEY_LEN
    selected: true
    priority: medium
    reason: HMAC key length paired with key bytes

  - unit_id: expected_mac_size_macro
    slot: EXPECTED_MAC_SIZE
    selected: true
    priority: high
    reason: post-init size oracle

  - unit_id: pre_init_get_size_call
    slot: PRE_INIT_GET_SIZE_CALL
    selected: false
    priority: critical
    reason: Non-mutable; original trigger before EVP_MAC_init
    role: oracle
    suggested_use: migrate_api_call

  - unit_id: evp_mac_init_call
    slot: INIT_CALL
    selected: false
    priority: critical
    reason: Non-mutable; establishes initialized control state
    suggested_use: migrate_api_call

  - unit_id: post_init_get_size_call
    slot: POST_INIT_GET_SIZE_CALL
    selected: false
    priority: critical
    reason: Non-mutable; validates initialized size
    role: oracle
    suggested_use: migrate_api_call
