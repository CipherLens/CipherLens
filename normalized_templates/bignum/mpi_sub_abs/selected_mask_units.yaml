    context_keywords:
    - canary
    - prepare_output_with_canary
    - buffer
    - buf
    - CANARY_SIZE
    - BUFLEN
    - output
    - memset
    oracle_variables:
    - ret
    - buf
    - canary
    preferred_roles:
    - mutation_point
    - trigger_call
    - oracle
    - input_preparation
    - cleanup
    context_limit: 12
    cleanup_limit: 2
