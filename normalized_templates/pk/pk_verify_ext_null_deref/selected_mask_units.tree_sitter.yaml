    if (!mbedtls_svc_key_id_is_null(key_id)) { psa_destroy_key(key_id); } mbedtls_ctr_drbg_free(&ctr_drbg);
    mbedtls_entropy_free(&entropy); mbedtls_psa_crypto_free(); return 0; }'
