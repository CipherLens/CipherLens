llm_role_proposal:
  provider: CODEX_EXEC
  fallback_policy: DISABLED
  timeout_seconds: 60
  structured_output_schema_ref: binding_proposal/payload.schema.yaml
  codex_exec:
    executable: codex
    working_root: .
    sandbox: READ_ONLY
    ephemeral: true
    ignore_user_config: true
    ignore_rules: true
    tool_network_policy: DISABLED_REQUIRED
    tool_network_isolation_proven: false
  glm:
    enabled: false
    credential_env: ZHIPUAI_API_KEY
    model_ref: glm-configured-model
