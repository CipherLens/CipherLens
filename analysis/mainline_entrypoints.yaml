schema: analysis_mainline_entrypoints_v1
root_entrypoint: analysis/full_mainline_glm_oracle_campaign.py
entrypoint_policy:
  unique_core_entrypoint: analysis/full_mainline_glm_oracle_campaign.py
  recommended_user_entrypoint: tools/mainline/run_one_click_glm_oracle_campaign.py
  multi_target_wrapper: tools/mainline/run_multi_target_family_campaign.py
  analysis_root_new_runner_allowed: false
  tools_root_new_script_allowed: false
  scratch_location: artifacts/cross_library/mainline/<task>/scratch/
entrypoints:
- name: full_mainline_glm_oracle_campaign
  path: analysis/full_mainline_glm_oracle_campaign.py
  role: unique core one-click GLM/oracle mainline runner
  network_required: only with --probe-mode live and GLM call path
  supports_probe_modes:
  - live
  - existing
- name: full_mainline_pipeline_integration
  path: analysis/full_mainline_pipeline_integration.py
  role: read-only full pipeline architecture/index smoke
  network_required: false
tool_wrappers:
- name: run_one_click_glm_oracle_campaign
  path: tools/mainline/run_one_click_glm_oracle_campaign.py
  delegates_to: analysis/full_mainline_glm_oracle_campaign.py
  role: recommended user/team entrypoint for the one-click mainline
- name: run_multi_target_family_campaign
  path: tools/mainline/run_multi_target_family_campaign.py
  role: optional thin wrapper for bounded multi-target syntax-only smoke
temporary_script_policy: Do not create temporary helper scripts in analysis/ or tools/ root.
