      - crt_extension_or_crl_extension_helpers
      not_required:
      - exact_mbedtls_error_code
      - exact_internal_mbedtls_parser_function_name
    migration_guidance:
      good_target_api_features:
      - parses DER or ASN.1 nested structures
      - has explicit parent and child length or end boundaries
      - exposes parse failure, error queue, consumed pointer, or equivalent oracle
      - accepts malformed nested structures as harness input
      bad_target_api_features:
      - hides all parser error classes and consumption state
      - cannot accept caller-provided DER bytes
      - only parses fully trusted pre-decoded objects
target:
  library: openssl
  candidate_api: d2i_X509
adapter:
  include_headers:
  - openssl/x509.h
  - openssl/err.h
  type_mapping:
    der input buffer: const unsigned char *der
    der length: size_t der_len
    parsed certificate: X509 *x509
    consumed length: long consumed_len
  constant_mapping: {}
  init_block: 'X509 *x509 = NULL;

    const unsigned char *p = NULL;

    long consumed_len = 0;'
  input_construction_block: 'p = der;

    consumed_len = 0;'
  trigger_block: 'x509 = d2i_X509(NULL, &p, (long) der_len);

    ret = (x509 != NULL) ? 0 : -1;

    consumed_len = (long)(p - der);'
  return_value_semantics: d2i_X509 returns a non-NULL X509 object on successful DER
    decode and NULL on parse failure. The adapter maps non-NULL to ret == 0 and NULL
    to ret != 0 while separately recording pointer consumption.
  oracle_strategy:
    oracle_type: pointer-consumption / return-code semantic oracle
    semantic_checks:
    - ret == 0 means d2i_X509 returned non-NULL and parsing succeeded.
    - consumed_len < der_len means only the DER prefix was consumed and trailing bytes
      remain.
    - ret != 0 means malformed DER or the boundary case was rejected.
    - This oracle observes pointer consumption and return-code semantics, not crash
      behavior.
    safe_signals:
    - ret != 0 for malformed nested ASN.1 boundary cases
    - ret == 0 with consumed_len == der_len for fully consumed valid DER
    bug_signals:
    - ret == 0 with consumed_len < der_len for unexpected prefix-only acceptance
  cleanup_block: X509_free(x509);
  llm_status: fallback
candidate:
  library: openssl
  api: d2i_X509
  decision: generate
