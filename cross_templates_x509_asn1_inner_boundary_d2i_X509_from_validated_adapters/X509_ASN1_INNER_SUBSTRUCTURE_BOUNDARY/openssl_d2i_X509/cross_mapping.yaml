preserved_vulnerability_features:
- x509_der_parser
- asn1_nested_structure
- malformed_der_input
- pointer_consumption_observable
- return_code_observable
lost_or_weakened_features:
- OpenSSL d2i_X509 ppin semantics allow callers to check whether the input was fully
  consumed.
- Inner ASN.1 boundary exact internal error codes may not map one-to-one to mbedTLS
  ret=-9184/-9186.
source_expected_behavior:
  buggy:
    signal: parser_crossed_inner_boundary
    return_code: -9186
    description: parser uses a parent boundary and reports unexpected tag after crossing
      the inner ASN.1 substructure
    sample_output:
    - '[BUG] buggy behavior: parser crossed inner ASN.1 substructure bounds.'
  fixed:
    signal: parser_obeyed_inner_boundary
    return_code: -9184
    description: parser obeys the inner ASN.1 substructure boundary and reports out-of-data
    sample_output:
    - '[OK] fixed behavior: parser obeyed inner ASN.1 substructure bounds.'
  note: OpenSSL d2i_X509 is not expected to reproduce exact mbedTLS numeric error
    codes; cross-library validation uses return-code and pointer-consumption semantics.
notes:
