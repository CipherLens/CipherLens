target_library: openssl
target_api: BN_bn2binpad
applicability: generate
include_headers:
- openssl/bn.h
type_mapping:
  BIGNUM *X: BIGNUM *X
  unsigned char *buf: unsigned char *to
  int BUFLEN: int tolen
constant_mapping:
  VALUE: BN_set_negative(X, 1)
  '[RADIX]': '2'
  BUFLEN: tolen
  '[CANARY_SIZE]': CANARY_SIZE
init_block: X = BN_new();
input_construction_block: 'BN_set_word(X, magnitude);

  if (signed_value < 0) { BN_set_negative(X, 1); }'
trigger_block: ret = BN_bn2binpad(X, buf, BUFLEN);
return_value_semantics: Returns 0 on success, negative error code on failure.
oracle_strategy:
  memory_safety:
  - Check if canary at buf[BUFLEN] is unchanged.
  semantic_checks:
  - Verify ret == 0 for successful serialization.
  bug_signals:
  - canary_corrupted(buf)
  safe_signals:
  - canary_intact(buf)
cleanup_block: BN_clear_free(X);
preserved_features:
- negative_integer_path
- sign_byte_written_before_digits
- caller_provided_output_buffer
- explicit_output_buffer_length
- library_writes_to_caller_buffer
- observable_boundary_oracle
lost_or_weakened_features:
- radix_parameter
- textual_sign_byte_before_digits
notes:
- The target API does not support radix-based text formatting, so the radix is fixed
  to 2 (binary).
- The target API does not write a textual sign byte, so the sign byte feature is weakened.
_llm_status: ok
validation:
  status: ok
  errors: []
  warnings:
  - normalized OpenSSL init_block to remove source-library mbedTLS initialization
  - normalized input_construction_block for OpenSSL BN_bn2binpad
  - normalized trigger_block for OpenSSL BN_bn2binpad
  - descriptive oracle_strategy mentions placeholder [BUFLEN], ignored for executable
    validation
  normalized: true
