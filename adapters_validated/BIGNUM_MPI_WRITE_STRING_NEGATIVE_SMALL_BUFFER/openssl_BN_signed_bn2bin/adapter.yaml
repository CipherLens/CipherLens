target_library: openssl
target_api: BN_signed_bn2bin
applicability: generate
include_headers:
- openssl/bn.h
- openssl/err.h
type_mapping:
  source_type_or_object: target_type_or_object
constant_mapping:
  source_placeholder: target_meaning
init_block: X = BN_new();
input_construction_block: 'BN_set_word(X, magnitude);

  if (signed_value < 0) { BN_set_negative(X, 1); }'
trigger_block: ret = BN_signed_bn2bin(X, buf, BUFLEN);
return_value_semantics: Returns 0 on success, negative error code on failure.
oracle_strategy:
  memory_safety:
  - Check if canary[BUFLEN] has been modified.
  semantic_checks:
  - Verify ret == 0 and buf[BUFLEN] == 0xA5.
  bug_signals:
  - canary[BUFLEN] != 0xA5
  safe_signals:
  - canary[BUFLEN] == 0xA5
cleanup_block: BN_clear_free(X);
preserved_features:
- negative_integer_path
- caller_provided_output_buffer
- explicit_output_buffer_length
- library_writes_to_caller_buffer
- observable_boundary_oracle
lost_or_weakened_features:
- radix_parameter
- textual radix string representation
notes:
- The target API does not support radix parameterization, so the default radix 2 is
  used.
- The target API returns a binary representation, not a textual one.
_llm_status: ok
validation:
  status: ok
  errors: []
  warnings:
  - normalized OpenSSL init_block to remove source-library mbedTLS initialization
  - normalized input_construction_block for OpenSSL BN_signed_bn2bin
  - descriptive oracle_strategy mentions placeholder [BUFLEN], ignored for executable
    validation
  normalized: true
