      vulnerability_path: 95
      harness_feasibility: 90
      final: 93
    preserved_features:
      - DER key parser
      - RSA private key path
      - PKCS#1 RSAPrivateKey top-level ASN.1 SEQUENCE
      - caller-controlled DER buffer and explicit input length
      - valid object followed by appended trailing garbage
      - return pointer success/failure oracle
      - pointer advancement oracle via const unsigned char **ppin
    preserved_vulnerability_features:
      - DER key parser
      - RSA private key path
      - PKCS#1 RSAPrivateKey top-level ASN.1 SEQUENCE
      - caller-controlled DER buffer and explicit input length
      - valid object followed by appended trailing garbage
      - return pointer success/failure oracle
      - pointer advancement oracle via const unsigned char **ppin
    lost_or_weakened_features:
      - exact mbedTLS MBEDTLS_ERR_RSA_BAD_INPUT_DATA return code is not preserved
      - OpenSSL d2i success may advance only to the consumed object, so harness must
        explicitly check p == der + der_len to detect accepted trailing bytes
    migration_reason: >
      Strongest private-key candidate. It decodes a PKCS#1 RSA private key from a
      caller-provided DER buffer with an explicit length and advances the input
      pointer on success, preserving the exact top-level object consumption oracle.
    required_features:
      - PKCS#1 RSA private DER input
      - appended trailing garbage after the top-level SEQUENCE
      - check return value is NULL/non-NULL
      - check p == der + der_len after success
      - free returned RSA with RSA_free
    notes:
      - Deprecated in OpenSSL 3.x, but still useful for RSA-specific migration
        harnesses when deprecated API visibility is enabled.
      - Treat non-NULL with p < der + der_len as accepted-with-trailing-data unless
        the harness policy requires exact consumption.

