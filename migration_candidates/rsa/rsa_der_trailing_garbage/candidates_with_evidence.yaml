  pattern_id: MBEDTLS-POC-0020
  internal_apis:
  - mbedtls_rsa_parse_key
  - mbedtls_rsa_parse_pubkey
  root_cause_summary: 'The source RSA DER parsers accepted valid PKCS#1 RSA private/public key DER followed
    by bytes outside the top-level ASN.1 SEQUENCE because the parser did not enforce exact consumption
    of the input buffer after reading the top-level SEQUENCE length.

    '
  vulnerability_path_features:
    must_preserve:
    - der_key_parser
    - rsa_private_or_public_key_path
    - top_level_asn1_sequence_length
    - valid_object_followed_by_trailing_bytes
    - parser_accepts_vs_rejects_extra_data
    - observable_return_or_pointer_consumption_oracle
    optional:
    - pkcs1_der_encoding
    - subject_public_key_info_public_key_encoding
    - generic_evp_private_key_decode_path
    not_required:
    - exact_mbedtls_error_code
    - exact_internal_mbedtls_parser_function_name
scoring_policy:
  operation_family: 0.15
  function_behavior: 0.2
  parameter_structure: 0.2
  vulnerability_path: 0.3
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    skip: otherwise
  score_notes:
  - Pointer advancement through const unsigned char **pp is treated as a strong oracle for exact top-level
    DER object consumption.
  - Generic EVP decoders are scored lower than RSA-specific decoders when they weaken the raw PKCS#1 object-shape
    equivalence.
required_features:
- target parses DER encoded key material
- target can receive valid DER followed by appended trailing garbage bytes
- target returns an observable success or failure value
- target exposes pointer advancement or another exact-consumption oracle
- harness can distinguish accepted trailing bytes from complete rejection
