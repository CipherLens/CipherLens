          \ and\n`mbedtls_rsa_parse_pubkey()`.\n\nThe confirmed fixed merge commit is\n`a7f651cf160a3753367e032c4471699822b37e30`;\
          \ the local buggy worktree used\n`a7f651cf160a3753367e032c4471699822b37e30^1`. The library fix\
          \ commit is\n`9de84bd67775e05fabca1907cd9f2ea33078d99a`.\n\n## Root Cause\n\nThe buggy RSA key\
          \ parsers parse the top-level ASN.1 SEQUENCE but do not verify\nthat the caller-provided DER\
          \ input ends exactly at the end of that SEQUENCE.\nThus a valid RSA key followed by extra bytes\
          \ can be accepted.\n\nThe fixed guard is:\n\n```c\nif (end != p + len) {\n    return MBEDTLS_ERR_RSA_BAD_INPUT_DATA;\n\
          }\n```\n\n## Trigger Condition\n\nThe PoC uses regression-test-derived PKCS#1 DER inputs:\n\n\
