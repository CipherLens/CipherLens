template_id: PK_VERIFY_EXT_OPAQUE_RSA_PSS_NULL_DEREF
source_template_id: PK_VERIFY_EXT_OPAQUE_RSA_PSS_NULL_DEREF
source:
  library: mbedtls
  api: mbedtls_pk_verify_ext
  pattern_id: MBEDTLS-POC-0003
  root_cause_summary: 'mbedtls_pk_verify_ext() enters the RSASSA-PSS verification
    path without first checking that the supplied PK context is an RSA context. For
    opaque PSA-wrapped keys, mbedtls_pk_rsa(*ctx) returns NULL. The RSA-PSS path dereferences
    the NULL RSA context, causing a segmentation fault. The fix adds a type guard:
    if (mbedtls_pk_get_type(ctx) != MBEDTLS_PK_RSA) return MBEDTLS_ERR_PK_FEATURE_UNAVAILABLE.

    '
  vulnerability_path_features:
    must_preserve:
    - generic_polymorphic_key_context_dispatch
    - rsa_pss_specific_verification_path_or_rsa_dispatch_code
    - incompatible_or_mismatched_key_type_entry
    - missing_type_check_before_rsa_context_access
    - observable_crash_vs_safe_error_return
    optional:
    - psa_opaque_key_mechanism
    - exact_mbedtls_error_code_value
    - exact_rsa_key_size
    not_required:
    - exact_psa_opaque_key_import_sequence
    - exact_mbedtls_internal_function_name
scoring_policy:
  operation_family: 0.15
  function_behavior: 0.2
  parameter_structure: 0.2
  vulnerability_path: 0.3
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    needs_llm_review: final >= 55 and vulnerability_path >= 50
    skip: otherwise
  score_notes:
  - The key criterion is whether the target API has a polymorphic key dispatch layer
    where an incompatible key type can reach RSA-specific code.
  - Exact mbedTLS error codes and PSA mechanisms are not required.
  - Oracle must be: crash (ASAN/SEGV/exit 139) or safe error return.
required_features:
- target has a generic or polymorphic public-key context or dispatch layer
- target has an RSA-PSS signature verification path or RSA-specific dispatch code
- target can receive a key object of incompatible type relative to the operation
- target exposes observable return code or crash signal for incompatible key type
- harness can construct incompatible key type without full TLS handshake
- harness is a standalone compilable C program
