          - Implementation file: `crypto/evp/signature.c`\n- Manpage: `doc/man3/EVP_PKEY_verify.pod`\n\
          - Signature:\n\n```c\nint EVP_PKEY_verify(EVP_PKEY_CTX *ctx,\n    const\
          \ unsigned char *sig, size_t siglen,\n    const unsigned char *tbs, size_t\
          \ tbslen);\n```\n\n## Semantics\n\n- Verifies a signature over data that\
          \ is already in the form expected by the key/signature algorithm.\n- Requires\
          \ an initialized `EVP_PKEY_CTX`, normally via `EVP_PKEY_verify_init`.\n\
          - For digest-based verification, `EVP_DigestVerify*` is often preferred.\n\
          \n## Return Value Semantics\n\n- Returns `1` on successful verification.\n\
          - Returns `0` when the signature does not verify.\n- Returns a negative\
          \ value for errors; `-2` can indicate operation not supported.\n\n## Object\
          \ and Buffer Constraints\n\n- `EVP_PKEY_CTX` and `EVP_PKEY` are opaque."
