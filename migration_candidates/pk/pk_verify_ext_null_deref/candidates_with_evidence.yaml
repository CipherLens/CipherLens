        text: "# API Constraints: EVP_DigestVerify (OpenSSL 3.5.5)\n\nSource version:\
          \ `/home/wen/work/clean_sources/openssl-3.5.5`\n\n## API\n\n- API/function\
          \ name: `EVP_DigestVerify`\n- Header declaration: `include/openssl/evp.h`\n\
          - Implementation file: `crypto/evp/m_sigver.c`\n- Manpage: `doc/man3/EVP_DigestVerifyInit.pod`\n\
          - Signature:\n\n```c\nint EVP_DigestVerify(EVP_MD_CTX *ctx, const unsigned\
          \ char *sigret,\n    size_t siglen, const unsigned char *tbs,\n    size_t\
          \ tbslen);\n```\n\n## Semantics\n\n- One-shot verification of `tbs` against\
          \ signature `sigret`.\n- Requires a context initialized by `EVP_DigestVerifyInit`\
          \ or `EVP_DigestVerifyInit_ex`.\n- Can be called only once before reinitializing\
          \ the `EVP_MD_CTX`.\n\n## Return Value Semantics\n\n- Returns `1` on valid\
          \ signature.\n- Returns `0` for verification failure or invalid signature\
          \ form.\n- Negative or other non-1 values indicate more serious errors depending\
          \ on provider/path.\n\n## Object and Buffer Constraints\n\n- `EVP_MD_CTX`,\
          \ `EVP_PKEY_CTX`, and `EVP_PKEY` are opaque."
