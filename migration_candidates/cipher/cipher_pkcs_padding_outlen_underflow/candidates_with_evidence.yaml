template_id: CIPHER_PKCS_PADDING_INVALID_OUTLEN_UNDERFLOW
source_template_id: CIPHER_PKCS_PADDING_INVALID_OUTLEN_UNDERFLOW
source:
  library: mbedtls
  api: mbedtls_cipher_finish
  pattern_id: MBEDTLS-POC-0004
  internal_apis:
  - get_pkcs_padding
  - mbedtls_get_pkcs_padding
  root_cause_summary: 'get_pkcs_padding computed *data_len = input_len - padding_len
    before rejecting padding_len > input_len, leaving an unsafe caller-visible output
    length on the invalid-padding error path.

    '
  vulnerability_path_features:
    must_preserve:
    - symmetric cipher finalization API
    - decrypt final padding check
    - caller-visible output length
    - return-code observable
    - invalid padding behavior
    - output length should remain zero on error
scoring_policy:
  operation_family: 0.15
  function_behavior: 0.2
  parameter_structure: 0.2
  vulnerability_path: 0.3
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    needs_llm_review: final >= 55 and vulnerability_path >= 50
    skip: otherwise
required_features:
- symmetric cipher finalization API
- decrypt final padding check
- caller-visible output length
- return-code observable
- invalid padding behavior
- output length should remain zero on error
