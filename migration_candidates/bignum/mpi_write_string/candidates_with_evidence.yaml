        text: "# MBEDTLS-POC-0001: mbedtls_mpi_write_string negative MPI buffer boundary\n\
          \n## Source\n\nThis pattern comes from Mbed TLS PR #2405 and issue #2404.\
          \ The affected API is `mbedtls_mpi_write_string` in `library/bignum.c`.\n\
          \n## Root Cause\n\nIn the buggy version, `mbedtls_mpi_write_string()` writes\
          \ the negative sign `'-'` when `X->s == -1`, but it does not decrement `buflen`\
          \ after writing the sign byte. As a result, the remaining conversion logic\
          \ receives an incorrect remaining buffer length and may write one byte past\
          \ the caller-provided output buffer.\n\nThe critical fix is:\n\n```c\nif\
          \ (X->s == -1) {\n    *p++ = '-';\n    buflen--;\n}\n```\n\n## Trigger Condition\n\
          \nThe minimal PoC sets the MPI value to `-1`, uses radix `2`, and passes\
          \ a small output buffer with `BUFLEN = 4`. A canary region is placed immediately\
          \ after the output buffer.\n\nThe buggy version corrupts the canary:\n\n\
          ```text\nret=0\nolen=3\nbuf/canary prefix=-1\\x00B1\\xa5...\n[BUG] Canary\
          \ corrupted: out-of-bounds write detected.\n```\n\nThe fixed versio"
