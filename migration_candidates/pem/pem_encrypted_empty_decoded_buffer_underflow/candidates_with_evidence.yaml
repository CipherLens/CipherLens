          \ name: `PEM_read_bio_PrivateKey`\n- Header/manpage: `include/openssl/pem.h`,\
          \ `doc/man3/PEM_read_bio_PrivateKey.pod`\n- Implementation file: `crypto/pem/pem_pkey.c`\n\
          - Signature:\n\n```c\nEVP_PKEY *PEM_read_bio_PrivateKey(BIO *bp, EVP_PKEY\
          \ **x,\n                                  pem_password_cb *cb, void *u);\n\
          ```\n\n## Semantics\n\n- Reads a PEM private key from `BIO`.\n- Uses decoder\
          \ path first, then legacy PEM byte extraction / DER decode fallback.\n-\
          \ Supports encrypted PEM through password callback.\n\n## Return Value Semantics\n\
          \n- Returns `EVP_PKEY *` on success.\n- Returns `NULL` on parse, decode,\
          \ password, or unsupported-key failure; callers inspect OpenSSL error queue.\n\
          \n## Ownership and Buffer Constraints\n\n- Returned key is caller-owned\
          \ and must be freed with `EVP_PKEY_free()`.\n- If `x != NULL`, any previous\
          \ `*x` can be replaced/freed by the read routine."
