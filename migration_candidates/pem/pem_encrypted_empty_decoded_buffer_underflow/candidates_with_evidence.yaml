          \ password, or unsupported-key failure; callers inspect OpenSSL error queue.\n\
          \n## Ownership and Buffer Constraints\n\n- Returned key is caller-owned\
          \ and must be freed with `EVP_PKEY_free()`.\n- If `x != NULL`, any previous\
          \ `*x` can be replaced/freed by the read routine."
