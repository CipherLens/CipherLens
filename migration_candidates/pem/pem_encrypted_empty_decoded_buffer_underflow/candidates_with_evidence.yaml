template_id: PEM_ENCRYPTED_EMPTY_DECODED_BUFFER_UNDERFLOW
source_template_id: PEM_ENCRYPTED_EMPTY_DECODED_BUFFER_UNDERFLOW
source:
  library: mbedtls
  api: mbedtls_pem_read_buffer
  pattern_id: MBEDTLS-POC-0011
  root_cause_summary: 'Malformed encrypted PEM input with fewer than four base64 characters
    decodes to an empty buffer. pem_check_pkcs_padding() is called with input_len
    == 0 and reads input[input_len - 1] (one byte before the heap region) without
    first checking input_len >= 1. Fixed by adding ''if (input_len < 1) { return MBEDTLS_ERR_PEM_INVALID_DATA;
    }''.

    '
  vulnerability_path_features:
    must_preserve:
    - pem_parser_entrypoint
    - encrypted_pem_path_with_password
    - malformed_or_short_base64_body
    - decoded_buffer_length_can_be_zero_or_tiny
    - padding_check_reads_last_byte
    - observable_asan_heap_underflow_or_safe_error
    optional:
    - AES_128_CBC_dek_info
    - EC_PRIVATE_KEY_label
    - password_based_decryption_path
    not_required:
    - exact_pem_line_wrapping
    - exact_heap_address
    - exact_ASan_wording
scoring_policy:
  operation_family: 0.15
  function_behavior: 0.2
  parameter_structure: 0.2
  vulnerability_path: 0.3
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    needs_llm_review: final >= 55 and vulnerability_path >= 50
    skip: otherwise
  score_notes:
  - Key criterion is whether the target API has an encrypted PEM path with base64
    decoding and padding check that can receive an empty/short buffer.
  - ASAN or safe-error oracle must be observable.
required_features:
- target parses encrypted PEM or similar armored cryptographic text
- target decodes base64 body and verifies padding
- target can receive attacker-controlled short base64 body
- target exposes observable return code, NULL pointer, or sanitizer crash signal
- harness is a standalone compilable C program with no TLS handshake
