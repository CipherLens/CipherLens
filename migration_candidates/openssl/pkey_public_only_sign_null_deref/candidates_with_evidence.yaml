        text: 'Return Value Semantics


          - `0`: signature is valid.

          - `MBEDTLS_ERR_PK_BAD_INPUT_DATA`: invalid inputs or uninitialized `ctx->pk_info`.

          - `MBEDTLS_ERR_PK_TYPE_MISMATCH`: context cannot be used for requested signature
          type.

          - `MBEDTLS_ERR_PK_FEATURE_UNAVAILABLE`: unsupported feature, including non-RSA
          context for RSA-PSS path.

          - `PSA_ERROR_INVALID_SIGNATURE` mapped through the PSA-to-mbedTLS error
          path can indicate invalid signature.


          ## Object Lifetime Constraints


          - `ctx` must be initialized and populated before verification.

          - Caller retains ownership of `hash` and `sig`; they are input buffers.

          - No caller-provided output buffer is used.


          ## Harness Generation Notes


          - Build or parse a key into `mbedtls_pk_context`, prepare digest and signature,
          then call `mbedtls_pk_verify_ext`.

          - For RSA-PSS migration, ensure the selected mbedTLS 4.1.0 enum name is
          `MBEDTLS_PK_SIGALG_RSA_PSS`.

          - Good oracles: return code, safe type rejection, no NULL dereference.


          ## Vulnerability-Pattern Migration'
