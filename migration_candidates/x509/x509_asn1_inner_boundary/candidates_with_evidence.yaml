source:
  library: mbedtls
  api: mbedtls_x509_crt_parse_der
  pattern_id: MBEDTLS-POC-0017
  root_cause_summary: 'X.509 ASN.1 nested parser used a parent end pointer while parsing
    an inner substructure. The malformed certificate with empty inner AttributeTypeAndValue
    structures differentiates buggy unexpected-tag behavior from fixed out-of-data
    inner-boundary behavior.

    '
  vulnerability_path_features:
    must_preserve:
    - asn1_der_parser_entrypoint
    - nested_substructure_length_field
    - parent_end_vs_inner_end_boundary
    - malformed_nested_empty_structure
    - differential_parser_error_or_rejection_path
    optional:
    - x509_certificate_der
    - issuer_name_attribute_type_value
    - consumed_pointer_or_error_queue_observation
    not_required:
    - exact_mbedtls_error_code
    - exact_internal_mbedtls_parser_function_name
