        text: "# MBEDTLS-POC-0017: X.509 ASN.1 inner substructure boundary\n\n## Source\n\
          \nThis pattern comes from Mbed TLS PR #2442 and issues #2430, #2431, and\
          \ #2437.\nThe affected public API for the local PoC is `mbedtls_x509_crt_parse_der`.\n\
          The root cause is in lower-level X.509 ASN.1 parsing helpers.\n\nThe confirmed\
          \ fixed merge commit is\n`7af080a9f9601449601e9c97d21256bdc2205d02`; the\
          \ local buggy worktree used\n`7af080a9f9601449601e9c97d21256bdc2205d02^1`.\
          \ The library fix commit is\n`12f62fb82c81aa3f52bed49dff0f9e038d115f75`.\n\
          \n## Root Cause\n\nSome parser routines used the parent ASN.1 structure's\
          \ `end` pointer while\nparsing a nested substructure. This allowed fields\
          \ inside an inner structure to\ncross the inner boundary.\n\nThe central\
