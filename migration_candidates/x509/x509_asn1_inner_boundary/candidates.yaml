template_id: X509_ASN1_INNER_SUBSTRUCTURE_BOUNDARY
source_template_id: X509_ASN1_INNER_SUBSTRUCTURE_BOUNDARY
source:
  library: mbedtls
  api: mbedtls_x509_crt_parse_der
  pattern_id: MBEDTLS-POC-0017
  root_cause_summary: >
    X.509 ASN.1 nested parser used a parent end pointer while parsing an inner
    substructure. The malformed certificate with empty inner
    AttributeTypeAndValue structures differentiates buggy unexpected-tag behavior
    from fixed out-of-data inner-boundary behavior.
  vulnerability_path_features:
    must_preserve:
      - asn1_der_parser_entrypoint
      - nested_substructure_length_field
      - parent_end_vs_inner_end_boundary
      - malformed_nested_empty_structure
      - differential_parser_error_or_rejection_path
    optional:
      - x509_certificate_der
      - issuer_name_attribute_type_value
      - consumed_pointer_or_error_queue_observation
    not_required:
      - exact_mbedtls_error_code
      - exact_internal_mbedtls_parser_function_name

scoring_policy:
  operation_family: 0.15
  function_behavior: 0.20
  parameter_structure: 0.20
  vulnerability_path: 0.30
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    skip: otherwise
  score_notes:
    - DER/X.509 parser compatibility and nested ASN.1 boundary observability are weighted more than name similarity.
    - Exact mbedTLS numeric return codes are not required for OpenSSL migration.
    - Pointer advancement and error queue reason are useful but may not fully recover the same inner-boundary class.

required_features:
  - target parses caller-provided DER or ASN.1 bytes
  - target reaches X.509 or generic ASN.1 nested parser code
  - target can receive malformed nested substructure bytes
  - target exposes an observable return value, error queue, consumed pointer, or equivalent rejection oracle
  - harness can compare accept/reject/error-path behavior for malformed DER

target_candidates:
