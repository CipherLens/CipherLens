    target_api: d2i_X509
    library: openssl
    api: d2i_X509
    source_template_id: X509_ASN1_INNER_SUBSTRUCTURE_BOUNDARY
    source_api: mbedtls_x509_crt_parse_der
    decision: generate
    migration_applicability: applicable
    applicability: strong_candidate
    scores:
      operation_family: 95
      function_behavior: 92
      parameter_structure: 90
      vulnerability_path: 88
      harness_feasibility: 90
      final: 91
    preserved_features:
      - DER X.509 certificate parser
      - caller-provided DER buffer and explicit length
      - nested ASN.1 parsing under X.509 certificate object
      - malformed DER certificate can be supplied directly
      - return NULL/non-NULL parse oracle
      - consumed pointer advancement through const unsigned char **pp
      - OpenSSL error queue can provide parse failure class
    preserved_vulnerability_features:
      - asn1_der_parser_entrypoint
      - x509_certificate_der
      - nested_substructure_length_field
      - malformed_nested_empty_structure
      - differential_parser_error_or_rejection_path
      - consumed_pointer_or_error_queue_observation
    weakened_features:
      - exact mbedTLS error codes are not preserved
      - OpenSSL error reason may be generic and may not map exactly to inner-boundary out-of-data vs unexpected-tag
    lost_or_weakened_features:
      - exact_mbedtls_error_code
      - exact_internal_mbedtls_parser_function_name
    migration_reason: >
      Strongest target candidate. It is the direct OpenSSL memory-buffer DER
      X.509 certificate decoder and exposes both return status and pointer
      advancement, making it suitable for malformed nested ASN.1 boundary tests.
    required_features:
      - construct malformed X.509 DER from the source PoC
      - call d2i_X509(NULL, &p, der_len)
      - observe returned X509 pointer or NULL
      - inspect p advancement and OpenSSL error queue if available
      - free returned X509 with X509_free
    notes:
      - Prefer this candidate before BIO or PEM wrappers.

