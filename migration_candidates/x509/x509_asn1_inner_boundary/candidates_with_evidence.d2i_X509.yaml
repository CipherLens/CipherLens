  operation_family: 0.15
  function_behavior: 0.2
  parameter_structure: 0.2
  vulnerability_path: 0.3
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    skip: otherwise
  score_notes:
  - DER/X.509 parser compatibility and nested ASN.1 boundary observability are weighted
    more than name similarity.
  - Exact mbedTLS numeric return codes are not required for OpenSSL migration.
  - Pointer advancement and error queue reason are useful but may not fully recover
    the same inner-boundary class.
