template_id: ASN1_STORE_NAMED_DATA_ZERO_LEN_STALE_STATE
source_template_id: ASN1_STORE_NAMED_DATA_ZERO_LEN_STALE_STATE
source:
  library: mbedtls
  api: mbedtls_asn1_store_named_data
  pattern_id: MBEDTLS-POC-0005
  root_cause_summary: 'mbedtls_asn1_store_named_data() freed cur->val.p on zero-length
    update but did NOT clear cur->val.len. A subsequent call with val_len == stale
    val.len skipped reallocation (cur->val.len == val_len) and called memcpy(NULL,
    ..., val_len), causing a NULL pointer dereference. Fixed by adding cur->val.len
    = 0 after the free.

    '
  vulnerability_path_features:
    must_preserve:
    - mutable_named_object_with_pointer_length_pair
    - repeated_update_of_same_object
    - zero_length_update_modifies_pointer_state
    - later_nonzero_reuse_with_same_length
    - observable_null_dereference_or_safe_reallocation
    optional:
    - OID_based_object_lookup
    - linked_list_storage
    not_required:
    - exact_OID_value
    - exact_heap_address
    - exact_mbedtls_internal_function_name
candidate_evaluation_notes: "mbedtls_asn1_store_named_data is an OID-keyed linked-list\
  \ named-data API unique to mbedTLS. No OpenSSL public API has exact equivalent semantics.\
  \ The following candidates were evaluated:\nRejected candidates:\n  X509_NAME_add_entry_by_txt:\n\
  \    reason: Only ADDS new entries, never UPDATES existing ones. Cannot reproduce\n\
  \            the repeated-update lifecycle.\n  X509_NAME_ENTRY_set_data:\n    reason:\
  \ Updates an entry's value, but X509_NAME_ENTRY does not manage the\n          \
  \  same OID-lookup-then-update pattern. Requires complex setup.\n  X509_EXTENSION_create_by_NID:\n\
  \    reason: Creates a new extension each call; does not support in-place update\n\
  \            of existing extension values.\n  ASN1_OCTET_STRING_set:\n    reason:\
  \ Wrapper around ASN1_STRING_set with identical behavior. Use\n            ASN1_STRING_set\
  \ directly as it's more general.\n\nSelected target:\n  ASN1_STRING_set (semantic\
  \ projection):\n    - Manages an internal 'data pointer + length' pair (analogous\
  \ to val.p + val.len)\n    - Supports repeated updates to the same ASN1_STRING object\n\
  \    - Supports zero-length updates: ASN1_STRING_set(s, NULL, 0) sets length=0\n\
  \    - Observable return code (1=success, 0=failure)\n    - ASAN would detect any\
  \ memory safety violation\n    - PUBLIC API: openssl/asn1.h\n    - LIMITATION: OpenSSL\
  \ keeps the buffer allocated on zero-length update\n      (does not free val.p),\
  \ so the exact stale-pointer bug path is not\n      reproducible. This is a semantic\
  \ projection; the test shows OpenSSL\n      handles the lifecycle safely. Expected\
  \ result: migrated_safe.\n"
scoring_policy:
  operation_family: 0.15
  function_behavior: 0.2
  parameter_structure: 0.2
  vulnerability_path: 0.3
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    needs_llm_review: final >= 55 and vulnerability_path >= 50
    skip: otherwise
required_features:
- target manages an internal buffer with pointer + length state
- target supports repeated updates (nonempty → zero → nonempty)
- target has zero-length update semantics
- target returns observable success/failure code
- harness can observe safe/unsafe behavior through ASAN + return code
- public API accessible without private headers
