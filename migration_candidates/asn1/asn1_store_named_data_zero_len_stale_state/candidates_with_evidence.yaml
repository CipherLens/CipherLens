  preserved_features:
  - mutable_named_object_with_pointer_length_pair (ASN1_STRING has data+length)
  - repeated_update_of_same_object (same ASN1_STRING called multiple times)
  - zero_length_update_modifies_pointer_state (sets length=0)
  - later_nonzero_reuse_with_same_length (step3 reuse)
  - observable_null_dereference_or_safe_reallocation (ASAN + return code)
  preserved_vulnerability_features:
  - mutable_named_object_with_pointer_length_pair
  - repeated_update_of_same_object
  - zero_length_update_modifies_pointer_state
  weakened_features:
  - OpenSSL ASN1_STRING_set does NOT free the buffer on zero-length update (keeps
    data allocated, sets length=0). No stale NULL + nonzero len.
  - OID-keyed linked-list lookup has no OpenSSL equivalent; replaced by direct ASN1_STRING
    object reference.
  - The exact NULL dereference path is not reproducible through OpenSSL's public API
    with normal usage sequences.
  lost_or_weakened_features:
  - OID_based_object_lookup
  - linked_list_storage
  - exact_stale_null_pointer_path
  migration_reason: 'Best available candidate for semantic projection. ASN1_STRING_set
    manages the same pointer+length internal state and supports the nonempty→zero→nonempty
    lifecycle. OpenSSL''s implementation handles zero-length updates safely (no stale
    NULL pointer). The test demonstrates that OpenSSL does not have the equivalent
    of the mbedTLS stale-pointer bug. Expected: migrated_safe. This is a valid negative
    result showing OpenSSL''s safer implementation.

    '
  required_features:
  - create ASN1_STRING with ASN1_STRING_new
  - step1: ASN1_STRING_set(s, data, FIRST_VALUE_LEN) - nonzero update
  - step2: ASN1_STRING_set(s, NULL, 0) - zero-length update
  - step3: ASN1_STRING_set(s, data2, FIRST_VALUE_LEN) - reuse
  - observe return code and ASN1_STRING_get0_data / ASN1_STRING_length
  - ASN1_STRING_free at cleanup
  notes:
  - This migration uses object_state_lifecycle with semantic_projection flag.
  - Decision is 'generate' for the negative-result contribution showing OpenSSL safety.
  - score < 75 but >= 55 normally means needs_llm_review; we override to generate
    because this is the only viable public API and the research value is the migrated_safe
    result.
