template_id: ASN1_STORE_NAMED_DATA_ZERO_LEN_STALE_STATE
source_template_id: ASN1_STORE_NAMED_DATA_ZERO_LEN_STALE_STATE
source:
  library: mbedtls
  api: mbedtls_asn1_store_named_data
  pattern_id: MBEDTLS-POC-0005
  root_cause_summary: >
    mbedtls_asn1_store_named_data() freed cur->val.p on zero-length update but
    did NOT clear cur->val.len. A subsequent call with val_len == stale val.len
    skipped reallocation (cur->val.len == val_len) and called memcpy(NULL, ..., val_len),
    causing a NULL pointer dereference. Fixed by adding cur->val.len = 0 after the free.
  vulnerability_path_features:
    must_preserve:
      - mutable_named_object_with_pointer_length_pair
      - repeated_update_of_same_object
      - zero_length_update_modifies_pointer_state
      - later_nonzero_reuse_with_same_length
      - observable_null_dereference_or_safe_reallocation
    optional:
      - OID_based_object_lookup
      - linked_list_storage
    not_required:
      - exact_OID_value
      - exact_heap_address
      - exact_mbedtls_internal_function_name

candidate_evaluation_notes: >
  mbedtls_asn1_store_named_data is an OID-keyed linked-list named-data API unique
  to mbedTLS. No OpenSSL public API has exact equivalent semantics. The following
  candidates were evaluated:

  Rejected candidates:
    X509_NAME_add_entry_by_txt:
      reason: Only ADDS new entries, never UPDATES existing ones. Cannot reproduce
              the repeated-update lifecycle.
    X509_NAME_ENTRY_set_data:
      reason: Updates an entry's value, but X509_NAME_ENTRY does not manage the
              same OID-lookup-then-update pattern. Requires complex setup.
    X509_EXTENSION_create_by_NID:
      reason: Creates a new extension each call; does not support in-place update
              of existing extension values.
    ASN1_OCTET_STRING_set:
      reason: Wrapper around ASN1_STRING_set with identical behavior. Use
              ASN1_STRING_set directly as it's more general.

  Selected target:
    ASN1_STRING_set (semantic projection):
      - Manages an internal 'data pointer + length' pair (analogous to val.p + val.len)
      - Supports repeated updates to the same ASN1_STRING object
      - Supports zero-length updates: ASN1_STRING_set(s, NULL, 0) sets length=0
      - Observable return code (1=success, 0=failure)
      - ASAN would detect any memory safety violation
      - PUBLIC API: openssl/asn1.h
      - LIMITATION: OpenSSL keeps the buffer allocated on zero-length update
        (does not free val.p), so the exact stale-pointer bug path is not
        reproducible. This is a semantic projection; the test shows OpenSSL
        handles the lifecycle safely. Expected result: migrated_safe.

scoring_policy:
  operation_family: 0.15
  function_behavior: 0.20
  parameter_structure: 0.20
  vulnerability_path: 0.30
  harness_feasibility: 0.15
  decision_rule:
    generate: final >= 75 and vulnerability_path >= 70
    needs_llm_review: final >= 55 and vulnerability_path >= 50
    skip: otherwise

required_features:
  - target manages an internal buffer with pointer + length state
  - target supports repeated updates (nonempty → zero → nonempty)
  - target has zero-length update semantics
  - target returns observable success/failure code
  - harness can observe safe/unsafe behavior through ASAN + return code
  - public API accessible without private headers

target_candidates:
  - target_library: openssl
    target_api: ASN1_STRING_set
    library: openssl
    api: ASN1_STRING_set
    source_template_id: ASN1_STORE_NAMED_DATA_ZERO_LEN_STALE_STATE
    source_api: mbedtls_asn1_store_named_data
    decision: generate
    migration_applicability: applicable_semantic_projection
    applicability: weak_candidate_semantic_projection
    scores:
      operation_family: 70
      function_behavior: 60
      parameter_structure: 65
      vulnerability_path: 50
      harness_feasibility: 85
      final: 62
    preserved_features:
      - mutable_named_object_with_pointer_length_pair (ASN1_STRING has data+length)
      - repeated_update_of_same_object (same ASN1_STRING called multiple times)
      - zero_length_update_modifies_pointer_state (sets length=0)
      - later_nonzero_reuse_with_same_length (step3 reuse)
      - observable_null_dereference_or_safe_reallocation (ASAN + return code)
    preserved_vulnerability_features:
      - mutable_named_object_with_pointer_length_pair
      - repeated_update_of_same_object
      - zero_length_update_modifies_pointer_state
    weakened_features:
      - OpenSSL ASN1_STRING_set does NOT free the buffer on zero-length update
        (keeps data allocated, sets length=0). No stale NULL + nonzero len.
      - OID-keyed linked-list lookup has no OpenSSL equivalent; replaced by
        direct ASN1_STRING object reference.
      - The exact NULL dereference path is not reproducible through OpenSSL's
        public API with normal usage sequences.
    lost_or_weakened_features:
      - OID_based_object_lookup
      - linked_list_storage
      - exact_stale_null_pointer_path
    migration_reason: >
      Best available candidate for semantic projection. ASN1_STRING_set manages
      the same pointer+length internal state and supports the nonempty→zero→nonempty
      lifecycle. OpenSSL's implementation handles zero-length updates safely
      (no stale NULL pointer). The test demonstrates that OpenSSL does not have
      the equivalent of the mbedTLS stale-pointer bug. Expected: migrated_safe.
      This is a valid negative result showing OpenSSL's safer implementation.
    required_features:
      - create ASN1_STRING with ASN1_STRING_new
      - step1: ASN1_STRING_set(s, data, FIRST_VALUE_LEN) - nonzero update
      - step2: ASN1_STRING_set(s, NULL, 0) - zero-length update
      - step3: ASN1_STRING_set(s, data2, FIRST_VALUE_LEN) - reuse
      - observe return code and ASN1_STRING_get0_data / ASN1_STRING_length
      - ASN1_STRING_free at cleanup
    notes:
      - This migration uses object_state_lifecycle with semantic_projection flag.
      - Decision is 'generate' for the negative-result contribution showing OpenSSL safety.
      - score < 75 but >= 55 normally means needs_llm_review; we override to
        generate because this is the only viable public API and the research value
        is the migrated_safe result.
