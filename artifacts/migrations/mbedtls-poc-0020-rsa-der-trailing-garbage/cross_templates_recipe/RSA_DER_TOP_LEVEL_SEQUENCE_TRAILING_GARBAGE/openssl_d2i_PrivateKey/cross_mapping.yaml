preserved_vulnerability_features:
- DER private key parser
- RSA private key path when type is EVP_PKEY_RSA
- caller-controlled DER buffer and explicit input length
- valid object followed by appended trailing garbage
- return pointer success/failure oracle
- pointer advancement oracle via const unsigned char **pp
lost_or_weakened_features:
- generic EVP private-key path is less RSA-specific than mbedtls_rsa_parse_key
- may accept PKCS#8 PrivateKeyInfo as well as key-specific formats
- exact PKCS#1 top-level object shape can be weakened unless adapter fixes the input
  format
- exact mbedTLS return code is not preserved
source_expected_behavior:
  buggy:
    signal: malformed_key_accepted
    return_code: 0
    description: parser returns 0 and accepts DER bytes after the top-level RSA SEQUENCE
    sample_output:
    - '[BUG] private key parser accepted trailing garbage.'
    - '[BUG] public key parser accepted trailing garbage.'
  fixed:
    signal: trailing_garbage_rejected
    return_code: MBEDTLS_ERR_RSA_BAD_INPUT_DATA
    numeric_return_code_from_local_fixed_log: -16512
    description: parser rejects DER bytes outside the top-level RSA SEQUENCE
    sample_output:
    - '[OK] private key parser rejected trailing garbage.'
    - '[OK] public key parser rejected trailing garbage.'
  note: The target API is not expected to reproduce exact mbedTLS numeric error codes;
    cross-library validation uses the oracle semantics defined by the migrated harness
    family.
