          - Declaration: `tf-psa-crypto/include/mbedtls/pk.h`\n- Signature:\n\n```c\n\
          int mbedtls_pk_verify_ext(mbedtls_pk_sigalg_t type,\n                  \
          \        mbedtls_pk_context *ctx, mbedtls_md_type_t md_alg,\n          \
          \                const unsigned char *hash, size_t hash_len,\n         \
          \                 const unsigned char *sig, size_t sig_len);\n```\n\n##\
          \ Parameter Semantics\n\n- `type`: signature algorithm to verify, for example\
          \ `MBEDTLS_PK_SIGALG_RSA_PSS`.\n- `ctx`: populated public-key context.\n\
          - `md_alg`: hash algorithm.\n- `hash`/`hash_len`: digest to verify. If `md_alg\
          \ != MBEDTLS_MD_NONE` or `hash_len != 0`, `hash` must not be NULL.\n- `sig`/`sig_len`:\
          \ signature buffer and length.\n\n## Return Value Semantics\n\n- `0`: signature\
          \ is valid.\n- `MBEDTLS_ERR_PK_BAD_INPUT_DATA`: invalid inputs"
