- EVP_MAC_CTX_free
- EVP_MAC_free
trigger_apis: []
harness_family: object_state_lifecycle
selection_policy:
  method: ast_lite_high_value_mask_unit_selection
  rules:
  - Prefer role=mutation_point units.
  - Prefer mask_level=value or api_argument units.
  - Always retain trigger_call function_call/statement units.
  - Always retain oracle statement/block units.
  - Retain input_preparation/helper_function/block only when harness-family context
    keywords are present.
  - Use configured preferred_roles as scoring hints for each harness family.
  - Use configured oracle_variables to prioritize oracle-observable units.
  - Limit input/helper context to representative high-scoring units.
  - Limit cleanup units to one or two representative statements.
  - Deduplicate repeated code snippets.
  context_keywords:
  - state
  - lifecycle
  - init
  - free
  - reuse
  - zero
  - stale
  - length
  - pointer
  ast_report_name: ast_mask_report.tree_sitter.yaml
  family_rules_source: config/harness_family_ast_rules.yaml
  family_rule:
    context_keywords:
    - state
    - lifecycle
    - init
    - free
    - reuse
    - zero
    - stale
    - length
    - pointer
    oracle_variables:
    - ret
    - len
    - data
    preferred_roles:
    - mutation_point
    - trigger_call
    - oracle
    - input_preparation
    - cleanup
    context_limit: 12
    cleanup_limit: 2
