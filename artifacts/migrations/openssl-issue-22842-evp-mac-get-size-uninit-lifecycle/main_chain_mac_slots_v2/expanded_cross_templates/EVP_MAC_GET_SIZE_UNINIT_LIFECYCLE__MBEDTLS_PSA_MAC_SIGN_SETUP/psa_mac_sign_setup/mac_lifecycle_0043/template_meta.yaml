vulnerability_class: mac_context_uninitialized_state_query
description: 'Cross-library template for MAC context lifecycle size behavior. Source:
  OpenSSL EVP_MAC_CTX_get_mac_size before and after EVP_MAC_init. Target: mbedTLS
  md/HMAC pre-setup safe rejection and post-setup size query. This is an object lifecycle
  semantic projection, not a strict provider algctx NULL dereference reproduction.'
mask_slots:
- name: MAC_NAME
  type: string
  default: HMAC
  variants:
  - HMAC
- name: DIGEST_NAME
  type: string
  default: SHA256
  variants:
  - SHA256
- name: KEY_BYTES
  type: byte_array
  default: '"rag-seed-hmac-key"'
  variants:
  - '"rag-seed-hmac-key"'
- name: KEY_LEN
  type: integer
  default: 17
  variants:
  - 17
- name: EXPECTED_MAC_SIZE
  type: integer
  default: 32
  variants:
  - 32
required_observables:
- pre_setup_size_query_result
- init_return_code
- post_setup_size_query_result
- crash_or_sanitizer_signal
- process_exit_code
safe_behavior:
  condition: pre-init size query does not crash and post-init size equals expected
    MAC size
  description: MAC context lifecycle safely handles pre-init state query and initialized
    size query
bug_behavior:
  condition: ASAN/UBSAN crash or SEGV during pre-init EVP_MAC_CTX_get_mac_size
  description: Uninitialized MAC context state query reaches unsafe NULL provider
    algctx dereference
triage_behavior:
  condition: pre-init size is nonzero, post-init size mismatch, or init fails before
    observation
  description: MAC context lifecycle behavior differs from expected projection and
    needs manual review
semantic_projection:
  kind: object_lifecycle_semantic_projection
  strict_equivalence: false
  note: mbedTLS public md/HMAC APIs do not expose OpenSSL provider algctx internals.
    The harness validates safe context lifecycle behavior.
status: cross_generated_from_llm_adapter
source_template_id: EVP_MAC_GET_SIZE_UNINIT_LIFECYCLE
cross_library:
  mbedtls:
    target_api: psa_mac_sign_setup
    target_template: tmpl_mbedtls.c
    adapter_source: recipe_slot_bindings
    applicability: generate
    preserved_features:
    - PSA MAC operation lifecycle represents pre-setup and initialized operation states
    - pre-setup psa_mac_update return code observes safe rejection
    - psa_mac_sign_setup plus psa_mac_update plus psa_mac_sign_finish observes initialized
      behavior
