template_id: EVP_MAC_GET_SIZE_UNINIT_LIFECYCLE__MBEDTLS_PSA_MAC_SIGN_SETUP__mac_lifecycle_0046
pattern_id: OPENSSL-ISSUE-22842
source_library: openssl
source_component: EVP/MAC
harness_family: object_state_lifecycle
oracle_type: mac_context_size_lifecycle_oracle
source_api:
- EVP_MAC_fetch
- EVP_MAC_CTX_new
- EVP_MAC_CTX_get_mac_size
- EVP_MAC_init
- EVP_MAC_CTX_free
