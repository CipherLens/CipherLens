projection_limitations:
  invalid_algorithm_parameter_combos:
  - mac_algorithm: HMAC
    digest_or_cipher_prefix: AES-
    reason: HMAC requires a digest such as SHA256 or SHA512, not an AES cipher.
  - mac_algorithm: CMAC
    digest_or_cipher_prefix: SHA
    reason: CMAC requires an AES block cipher, not a SHA digest.
  unsupported_sequences:
  - lifecycle_sequence: query_size_before_setup
    reason: mbedTLS PSA MAC has no public pre-setup size query equivalent.
