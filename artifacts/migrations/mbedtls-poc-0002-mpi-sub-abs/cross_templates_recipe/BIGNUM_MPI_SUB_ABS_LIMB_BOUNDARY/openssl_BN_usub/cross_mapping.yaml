candidate:
  library: openssl
  api: BN_usub
  decision: skip
  scores:
    operation_family: 85
    function_behavior: 70
    parameter_structure: 60
    vulnerability_path: 45
    harness_feasibility: 70
    final: 63
preserved_vulnerability_features:
- bignum_subtraction
- A_B_operand_relation
lost_or_weakened_features:
- manual_output_limb_boundary_control
- direct_canary_after_output_limbs
source_expected_behavior:
  buggy: {}
  fixed: {}
  note: The target API is not expected to reproduce exact mbedTLS numeric error codes;
    cross-library validation uses the oracle semantics defined by the migrated harness
    family.
notes:
- Generated from LLM-filled structured adapter YAML.
- The C harness skeleton is fixed; the target-specific blocks come from adapter.yaml.
- This is vulnerability-path migration, not strict full API semantic equivalence.
