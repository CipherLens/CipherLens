preserved_vulnerability_features:
- same operation family: EdDSA / Ed25519 signing
- same capability mismatch oracle: public-only key must not sign
- PSA key type: PSA_KEY_TYPE_ECC_PUBLIC_KEY(PSA_ECC_FAMILY_TWISTED_EDWARDS) covers
    Ed25519
- PSA algorithm: PSA_ALG_PURE_EDDSA for Ed25519
- psa_sign_message directly tests signing capability
- key without PSA_KEY_USAGE_SIGN_MESSAGE usage flag = public-only equivalent
- oracle: psa_sign_message must return PSA_ERROR_NOT_PERMITTED (safe rejection)
- self-contained single-process harness feasible
- crash oracle also applicable: ASAN/UBSAN if PSA implementation is buggy
lost_or_weakened_features:
- PSA uses key handle (psa_key_id_t) instead of EVP_PKEY pointer directly
- PSA capability check is explicit via key usage flags (PSA_KEY_USAGE_SIGN_MESSAGE)
- PSA is more likely to catch this at import/policy level rather than in sign path
- 'slightly different failure mode: policy rejection vs NULL deref at sign time'
- psa_sign_message signature differs from EVP_DigestSign (key_id, alg, msg → sig)
