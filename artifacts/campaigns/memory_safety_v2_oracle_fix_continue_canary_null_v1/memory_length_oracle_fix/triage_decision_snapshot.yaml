reason: UBSAN is stable and occurs in OpenSSL EVP_EncodeBlock internals, but the triggering input passes
  NULL as the input pointer with a nonzero length. Local docs describe f as input data of length n, and
  the implementation reads f when n > 0 without a NULL guard; this is best treated as a contract-boundary
  hardening observation rather than a retained sanitizer candidate.
trigger_api: EVP_EncodeBlock
ubsan_location: openssl_internal
stacktrace_available: true
candidate_reproduced: true
candidate_reproduced_in_minimal_harness: true
api_contract_checked: true
api_contract_summary: EVP_EncodeBlock expects f to point to input data of length n; NULL f with n > 0
  is invalid API use. NULL f with n == 0 did not trigger sanitizer locally but is not explicitly documented
  as allowed.
null_nonzero_input_documented_invalid: true
asan_observed: true
ubsan_observed: true
crash_observed: true
harness_fault: false
recommended_next_action: Downgrade the campaign candidate to contract-boundary observation and adjust
  memory_length_boundary mutations so NULL input with nonzero length is marked invalid-contract unless
  the target API explicitly documents NULL as accepted.
