doc_evidence_summary: 本地 manpage 写明 CCM total plaintext/ciphertext length MUST 通过 in/out 为 NULL 的 update
  调用传入。同时，本地 provider 源码显示：AAD 路径在未设置 message length 且 AAD length 非零时返回错误；payload update 路径若尚未设置长度，会调用
  ccm_set_iv(ctx, len) 使用当前 payload length。因此文档语义与 payload-only 本地实现行为存在张力：带 AAD 缺长度会被拒绝，无 AAD payload-only
  缺长度可成功。
