sprint: asn1_nested_boundary_d_path_audit_v1
family: asn1_nested_boundary
why_selected:
- Ranked first after AEAD-GCM closure because GCM candidates were downgraded and ASN.1
  nested boundary has existing historical seeds.
- The family has a clearer malformed-structure oracle than AEAD-GCM lifecycle legal-semantics
  cases.
- Available seeds include MBEDTLS-POC-0017 and OPENSSL-ISSUE-30581.
difference_from_der_full_consumption:
  der_full_consumption: Focuses on whether a parser accepts a valid DER object prefix
    while ignoring trailing bytes after the top-level object.
  asn1_nested_boundary: Focuses on malformed nested child objects, inner length/end-pointer
    boundaries, and safe rejection inside the object.
seeds_found:
- MBEDTLS-POC-0017
- OPENSSL-ISSUE-30581
- OPENSSL-ISSUE-9043
mbedtls_poc_0017_evidence:
  total_cases: 16
  verdict_counts:
    safe_reject_behavior: 16
  total_pairs: 8
  migration_verdict_counts:
    migrated_safe: 8
openssl_issue_30581_available: true
crash_sanitizer_evidence: metadata_yes_strict_reproduction_no
api_mapping:
  openssl:
  - d2i_X509
  - d2i_X509_bio
  - X509_new
  - X509_free
  - ASN1_item_d2i
  - OSSL_DECODER
  - X509_verify_cert
  - d2i_PKCS12_fp
  - PKCS12_parse
  mbedtls:
  - mbedtls_x509_crt_parse
  - mbedtls_x509_crt_parse_der
  - mbedtls_x509_crt_free
oracle:
  safe_reject:
    description: malformed nested child object should be rejected without crash
  full_consumption:
    description: parser should not silently ignore malformed nested content if it
      belongs to the object
  no_crash:
    description: malformed ASN.1 should not cause SIGSEGV / abort
  cross_library_semantic_divergence:
    description: one library accepts nested malformed object while another rejects
      under comparable API
  app_level_validation_gap:
    description: only used if behavior reaches CLI/app level
can_enter_a_path_now: false
glm_used: false
next_task_name: asn1_nested_boundary_minimal_reproducer_v1
confirmed_vulnerability: false
recommend_continue_family: true
