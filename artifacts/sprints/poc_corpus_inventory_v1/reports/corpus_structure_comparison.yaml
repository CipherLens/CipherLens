library_structures:
  mbedtls:
    root: data/pocs
    shape: nested core10/MBEDTLS-POC-XXXX artifacts with metadata.json, README.md,
      poc/ and evidence files
    examples:
    - data/pocs/core10/MBEDTLS-POC-0001
    - data/pocs/core10/MBEDTLS-POC-0002
    - data/pocs/core10/MBEDTLS-POC-0003
    - data/pocs/core10/MBEDTLS-POC-0004
    - data/pocs/core10/MBEDTLS-POC-0005
  wolfssl:
    root: data/wolfssl_collect
    shape: WOLFSSL-POC-XXXX evidence bundles with inputs/logs/sources/scripts/notes
      and richer reproduction metadata
    examples:
    - data/wolfssl_collect/WOLFSSL-POC-0001
    - data/wolfssl_collect/WOLFSSL-POC-0002
    - data/wolfssl_collect/WOLFSSL-POC-0003
    - data/wolfssl_collect/WOLFSSL-POC-0004
    - data/wolfssl_collect/WOLFSSL-POC-0005
  openssl:
    root: datasets/openssl/poc_artifacts
    shape: flat issue_XXXXX artifacts with metadata.json, README.md, poc.c, run.sh
      and optional inputs
    examples:
    - datasets/openssl/poc_artifacts/issue_11567
    - datasets/openssl/poc_artifacts/issue_11772
    - datasets/openssl/poc_artifacts/issue_13860
    - datasets/openssl/poc_artifacts/issue_14457
    - datasets/openssl/poc_artifacts/issue_14675
ingestion_fallback_requirements:
- ID normalization from MBEDTLS-POC-XXXX, WOLFSSL-POC-XXXX, and issue_XXXXX/issue_number.
- Metadata key fallback across mbedTLS traceability/classification, wolfSSL harness/oracle
  fields, and OpenSSL issue artifact fields.
- PoC source detection must accept poc.c, poc/ directories, scripts/run.sh, and input-only
  evidence bundles.
- Do not infer vulnerability confirmation from corpus metadata; preserve strict_reproduction/local_test_result
  as evidence fields only.
