    validation_notes: 'Certificate-level strict reproduction succeeded on wolfSSL
      v5.9.0-stable commit 922d04b3568c6428a9fb905ddee3ef5a68db3108. The reconstructed
      DER certificate uses a small 20-byte AuthorityKeyIdentifier keyIdentifier and
      an oversized full AKID source of approximately 20046 bytes. The vulnerable code
      checks authKeyIdSz but copies authKeyIdSrcSz into cert->akid, producing ASan
      heap-buffer-overflow in CertFromX509. Fixed release candidate verified: wolfSSL
      v5.9.1-stable commit 1d363f3adceba9d1478230ede476a37b0dcdef24 safely rejects
      the oversized AuthorityKeyIdentifier input without sanitizer crash evidence.
      Current wolfSSL v5.9.1-stable-1373-g8fca95ce6 commit 8fca95ce651d6e370d91f5598786de4bc66aa2c2
      was tested with the same reconstructed oversized AuthorityKeyIdentifier DER
      certificate. It safely rejected the input without sanitizer crash evidence.'
