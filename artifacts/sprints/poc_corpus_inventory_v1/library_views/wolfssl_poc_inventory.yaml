    local_test_result: null
    input_status: false
    validation_notes: 'Strict reproduction succeeded on wolfSSL v3.10.2-stable using
      a reconstructed certificate generated from the public Exploit-DB/Talos PoC OpenSSL
      command. The input is not the original attached certificate bytes, but it preserves
      the published trigger structure and reproduces the reported ASan stack-buffer-overflow
      in wolfSSL_X509_NAME_get_text_by_NID. Fixed release candidate verified: wolfSSL
      v3.11.0-stable does not reproduce the ASan stack-buffer-overflow observed on
      v3.10.2-stable under the same minimal certfields harness and ASan/UBSan configuration.
      The first build attempt failed because -Werror promoted compiler warnings to
      errors; after removing -Werror from Makefile, the library built successfully.
      These build warnings are unrelated to the CVE-2017-2800 runtime PoC behavior.
      Current wolfSSL v5.9.1-stable-1299-geeab53205 commit eeab53205ab57451778f7a76aad25f5349547ce5
      was tested with the same reconstructed CVE-2017-2800 certificate and minimal
      certfields harness under ASan/UBSan. No ASan stack-buffer-overflow, WRITE of
      size 1, or abort was observed.'
  status: ready_for_ingestion
