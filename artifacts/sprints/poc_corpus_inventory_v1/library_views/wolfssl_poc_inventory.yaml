    validation_notes: 'API-level strict reproduction succeeded on wolfSSL v5.9.0-stable
      commit 922d04b3568c6428a9fb905ddee3ef5a68db3108 using a crafted WOLFSSL_ASN1_TIME
      object following PR 10071''s official test pattern. Both notAfter and notBefore
      paths triggered ASan heap-buffer-overflow with WRITE of size 255. Fixed release
      candidate verified: wolfSSL v5.9.1-stable commit 1d363f3adceba9d1478230ede476a37b0dcdef24
      rejects the oversized ASN1_TIME length in both notAfter and notBefore paths
      without sanitizer crash evidence. Current wolfSSL v5.9.1-stable-1373-g8fca95ce6
      commit 8fca95ce651d6e370d91f5598786de4bc66aa2c2 was tested with the same API-level
      X.509 date harness. Both notAfter and notBefore paths safely rejected the oversized
      ASN1_TIME length without sanitizer crash evidence.'
