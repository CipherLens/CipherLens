      identical.cnf -batch
    - /usr/local/bin/openssl req -new -x509 -days 3650 -key ca3.key -out ca3.crt -config
      ca3.cnf -batch
    - /usr/local/bin/openssl req -new -x509 -days 3650 -key ca4.key -out ca4.crt -config
