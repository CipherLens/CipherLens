  metadata_summary:
    title: openssl x509 returns 0 even though the date of certificate is invalid
    source_url: https://github.com/openssl/openssl/issues/11772
    state: null
    has_poc: 'YES'
    poc_type: CLI+INPUT_SEED
    quality: HIGH_CANDIDATE
    component: X509/X509V3/ASN1
    trigger_behavior: WRONG_RESULT
    affected_version: openssl-1.0.2u
    critical_api_or_function:
    - X509_cmp_time
    - X509_get0_notAfter
    root_cause: The function calling X509_cmp_time() doesn't check that it returned
      an error.
    reproduction_command:
    - build openssl-1.0.2u
    - unzip PoC.zip
    - openssl x509 -in $PoC -checkend 0 -noout
