sprint: x509_parsing_triage_v1
family: x509_parsing
route_planner_allows_triage: true
why_route_planner_allows_x509_triage: x509_parsing is scheduler top-1 with medium evidence, 11 known seeds,
  and route ambiguity that can be resolved through seed inventory/API grouping/oracle abstraction without
  execution.
why_render_run_disallowed: 'A-path gate is false: no validated recipe-slot mapping, comparable cross-library
  oracle, or controlled mutation matrix exists for this family. Evidence strength is only sufficient for
  triage.'
why_glm_disallowed: GLM is disabled because A-path gate is false; using GLM before explicit recipe/oracle
  mapping would risk hallucinated API contracts or free-form C blocks.
boundary:
  x509_parsing: Certificate/CRL/CSR parsing and verification behavior visible through OpenSSL app commands
    or X509 APIs, including purpose, time, chain, CRL, and verification-result semantics.
  der_full_consumption: Top-level DER object trailing-data/full-consumption semantics; only belongs here
    if the oracle is consumed_len vs input_len or accepted prefix DER.
  asn1_nested_boundary: Inner ASN.1 child/length/optional field malformed structure, sanitizer crash,
    or nested parse boundary behavior; x509 seeds with malformed short cert/CSR crash should be routed
    as overlap or D-path audit.
allowed_actions:
  auto_render: false
  auto_run: false
  auto_triage: true
  glm: false
gate_results:
  a_path_gate:
    passed: false
    reason: No validated cross-library recipe-slot mapping or comparable oracle yet.
  evidence_gate:
    passed: true
    reason: Medium scheduler evidence is enough for triage, not for render/run.
    strength: medium
  execution_gate:
    auto_render_allowed: false
    auto_run_allowed: false
    auto_triage_allowed: true
    reason: Planner can authorize only evidence collection and route disambiguation in the next sprint.
  glm_gate:
    allowed_role: none
    forbidden_role:
    - free_form_c_generation
    - API_contract_guessing
    - vulnerability_claim
    - sanitizer_interpretation
    glm_allowed: false
    reason: GLM is disallowed because A-path gate is false.
  route_gate:
    alternatives:
      A_recipe_slot_cross_library_migration: Blocked until source/target API mapping and oracle comparability
        are explicit.
      B_controlled_family_mutation: Possible later for verifier/state machine behavior after controls
        exist.
      D_crash_sanitizer_evidence_audit: Use only for seeds with real crash/sanitizer input and reproducibility
        path.
    reason: Use C-path only as a triage hypothesis because x509 has app-visible wrong-result cases; D-path
      and A/B alternatives remain unresolved.
    selected_route: C_app_level_validation_gap
