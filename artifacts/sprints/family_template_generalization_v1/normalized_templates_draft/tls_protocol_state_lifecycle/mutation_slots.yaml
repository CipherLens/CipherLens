schema: family_mutation_slots_v1
family: tls_protocol_state_lifecycle
template_level: family
seed_pocs: []
mutation_slots:
- slot_name: INIT_ORDER
  mutation_type: sequence
  seed_examples:
  - ctx_before_ssl
  - ssl_without_ctx
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - lifecycle_state
  - return_code_semantics
  - crash_or_sanitizer
  risk: API misuse must be labeled false-positive risk
- slot_name: SETUP_ORDER
  mutation_type: sequence
  seed_examples:
  - missing_config
  - partial_config
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - lifecycle_state
  - return_code_semantics
  - crash_or_sanitizer
  risk: distinguish expected safe error from vulnerability
- slot_name: HANDSHAKE_STATE
  mutation_type: enum
  seed_examples:
  - before
  - during
  - after
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - lifecycle_state
  - return_code_semantics
  - crash_or_sanitizer
  risk: requires deterministic mocked I/O later
- slot_name: IO_BEFORE_HANDSHAKE
  mutation_type: enum
  seed_examples:
  - read
  - write
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - lifecycle_state
  - return_code_semantics
  - crash_or_sanitizer
  risk: normal API misuse can dominate signal
- slot_name: CLEANUP_REPEAT
  mutation_type: integer
  seed_examples:
  - '0'
  - '1'
  - '2'
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - lifecycle_state
  - return_code_semantics
  - crash_or_sanitizer
  risk: double cleanup must not be overreported without crash evidence
mutation_budget_hint:
  small: 8
  medium: 32
  large: 96
scheduler_features:
- family
- oracle_type
- target_library
- mapping_gate_status
- seed_type
ast_maskable_units:
- unit_type: api_argument
  slot_name: INIT_ORDER
  node_kind_hint: argument or literal
  reason: API misuse must be labeled false-positive risk
- unit_type: api_argument
  slot_name: SETUP_ORDER
  node_kind_hint: argument or literal
  reason: distinguish expected safe error from vulnerability
- unit_type: api_argument
  slot_name: HANDSHAKE_STATE
  node_kind_hint: argument or literal
  reason: requires deterministic mocked I/O later
- unit_type: api_argument
  slot_name: IO_BEFORE_HANDSHAKE
  node_kind_hint: argument or literal
  reason: normal API misuse can dominate signal
- unit_type: api_argument
  slot_name: CLEANUP_REPEAT
  node_kind_hint: argument or literal
  reason: double cleanup must not be overreported without crash evidence
semantic_policy: mutate slots, preserve trigger/cleanup/oracle shape
notes:
- Budget hints are deterministic defaults for family-level planning.
