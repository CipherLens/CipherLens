schema: family_mutation_slots_v1
family: asn1_nested_boundary
template_level: family
seed_pocs:
- WOLFSSL-POC-0004
mutation_slots:
- slot_name: ASN1_NESTED_LENGTH
  mutation_type: integer
  seed_examples:
  - short
  - exact
  - long
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - parser_reject_accept
  - full_consumption
  - return_code_semantics
  risk: RAG v2 wc_ParseCert recall is weaker; use as risk, not block
- slot_name: DER_BYTES
  mutation_type: byte_array
  seed_examples:
  - well_formed
  - truncated
  - malformed_tag
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - parser_reject_accept
  - full_consumption
  - return_code_semantics
  risk: keep DER buffer and len paired
- slot_name: TRAILING_GARBAGE
  mutation_type: byte_array
  seed_examples:
  - none
  - '00'
  - random_tail
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - parser_reject_accept
  - full_consumption
  - return_code_semantics
  risk: needs pointer/consumption observable
- slot_name: NESTED_DEPTH
  mutation_type: integer
  seed_examples:
  - '1'
  - '2'
  - '8'
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - parser_reject_accept
  - full_consumption
  - return_code_semantics
  risk: deep nesting may trigger resource limits
- slot_name: EXPECT_RET
  mutation_type: enum
  seed_examples:
  - accept
  - reject
  allowed_mutations:
  - boundary
  - malformed
  - valid_control
  expected_oracle:
  - parser_reject_accept
  - full_consumption
  - return_code_semantics
  risk: semantic labels preferred over numeric codes
mutation_budget_hint:
  small: 8
  medium: 32
  large: 96
scheduler_features:
- family
- oracle_type
- target_library
- mapping_gate_status
- seed_type
ast_maskable_units:
- unit_type: api_argument
  slot_name: ASN1_NESTED_LENGTH
  node_kind_hint: argument or literal
  reason: RAG v2 wc_ParseCert recall is weaker; use as risk, not block
- unit_type: api_argument
  slot_name: DER_BYTES
  node_kind_hint: argument or literal
  reason: keep DER buffer and len paired
- unit_type: api_argument
  slot_name: TRAILING_GARBAGE
  node_kind_hint: argument or literal
  reason: needs pointer/consumption observable
- unit_type: api_argument
  slot_name: NESTED_DEPTH
  node_kind_hint: argument or literal
  reason: deep nesting may trigger resource limits
- unit_type: api_argument
  slot_name: EXPECT_RET
  node_kind_hint: argument or literal
  reason: semantic labels preferred over numeric codes
semantic_policy: mutate slots, preserve trigger/cleanup/oracle shape
notes:
- Budget hints are deterministic defaults for family-level planning.
