analyzer_analyze_poc_summary:
  does:
  - Reads a C PoC file.
  - 'Extracts #include directives and #define macros.'
  - Collects semicolon-ended statements and approximates function calls.
  - Marks crypto API calls by prefixes such as mbedtls_, psa_, BN_, EVP_, RSA_, ECDSA_, Botan::.
  - Guesses library and trigger API.
  - Extracts simple oracle helper markers such as canary_corrupted and fixed return checks.
  does_not_do:
  - It does not classify runtime compile/run results.
  - It does not inspect sanitizer logs.
  - It does not produce migration verdicts.
