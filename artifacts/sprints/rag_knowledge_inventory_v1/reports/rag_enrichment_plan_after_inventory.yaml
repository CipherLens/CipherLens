rag_enrichment_plan_after_inventory:
- step: 1
  task: rag_enrichment_from_ingestion_v1
  action: Import only high-confidence structured PoC summaries.
- step: 2
  task: api_card_enrichment_for_top_families_v1
  action: Add wolfSSL / TLS / DTLS / ASN.1 / PKCS7 / PKCS12 / X509 API cards.
- step: 3
  task: api_correlation_inventory_v1
  action: Extract API correlation from corrected candidates and PoC call sequences.
- step: 4
  task: rag_rebuild_and_query_eval_v1
  action: Rebuild and evaluate whether queries retrieve correct evidence.
- step: 5
  task: template_schema_inventory_v1
  action: Inventory template schemas before template generation.
principles:
- Do not import all raw PoCs, raw HTML, or raw logs.
- Import structured summaries only.
- Mark placeholder, synthetic, and source-vector seed provenance.
- Import negative feedback as down-ranking evidence.
- RAG supports gates and adapters; it does not replace analyzers.
needs_wolfssl_constraints: true
needs_top_family_api_cards: true
