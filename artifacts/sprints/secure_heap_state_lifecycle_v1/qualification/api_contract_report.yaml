api: CRYPTO_secure_used
contract_status: undocumented_or_ambiguous
source_evidence:
  - file: ${CLEAN_SOURCES_ROOT}/openssl-3.5.5/crypto/mem_sec.c
    lines_or_snippet: >
      CRYPTO_secure_used() initializes ret to 0, then calls
      CRYPTO_THREAD_read_lock(sec_malloc_lock) without first checking
      secure_mem_initialized. It then reads secure_mem_used and unlocks.
  - file: ${CLEAN_SOURCES_ROOT}/openssl-3.5.5/crypto/mem_sec.c
    lines_or_snippet: >
      CRYPTO_secure_malloc_done() sets secure_mem_initialized to 0, frees
      sec_malloc_lock, and sets sec_malloc_lock to NULL when secure_mem_used is 0.
  - file: ${CLEAN_SOURCES_ROOT}/openssl-3.5.5/crypto/mem_sec.c
    lines_or_snippet: >
      CRYPTO_secure_allocated() explicitly returns 0 when
      secure_mem_initialized is false, providing a contrasting guarded query API.
doc_evidence:
  - file: ${CLEAN_SOURCES_ROOT}/openssl-3.5.5/doc/man3/OPENSSL_secure_malloc.pod
    lines_or_snippet: >
      CRYPTO_secure_malloc_initialized() indicates whether the secure heap has
      been initialized and is available.
  - file: ${CLEAN_SOURCES_ROOT}/openssl-3.5.5/doc/man3/OPENSSL_secure_malloc.pod
    lines_or_snippet: >
      CRYPTO_secure_malloc_done() releases the heap and makes the memory
      unavailable to the process if all secure memory has been freed.
  - file: ${CLEAN_SOURCES_ROOT}/openssl-3.5.5/doc/man3/OPENSSL_secure_malloc.pod
    lines_or_snippet: >
      CRYPTO_secure_used() returns the number of bytes allocated in the secure
      heap. The local manpage does not explicitly say that it requires prior
      initialization, nor that pre-init or post-done calls are undefined.
pre_init_call_status: ambiguous_not_documented_as_disallowed
done_then_used_status: ambiguous_not_documented_as_disallowed
initialized_control_status: documented_available_state_and_current_control_ok
does_crash_violate_documented_contract: unknown
needs_manual_doc_confirmation: true
implementation_level_crash_evidence: >
  Source-level state transition suggests sec_malloc_lock can be NULL before init
  or after done, while CRYPTO_secure_used() still passes it to
  CRYPTO_THREAD_read_lock().
qualification_implication: >
  Because the docs do not clearly require initialization before CRYPTO_secure_used(),
  this is stronger than a clearly documented API misuse case, but still remains
  a robustness_hardening_candidate rather than confirmed_vulnerability_candidate
  until manual contract confirmation and debug/version evidence are complete.
