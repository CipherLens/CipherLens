matrix_name: OPENSSL-ISSUE-28669 local version matrix
available_versions:
  - openssl_version: OpenSSL 3.5.5 27 Jan 2026
    path: ${CLEAN_SOURCES_ROOT}/openssl-3.5.5
    build_available: true
    compile_success: true
    pre_init_used_only:
      exit_code: 139
      signal: 11
      verdict: crash_candidate
      notes: SIGSEGV before CRYPTO_secure_used returns
    done_then_used:
      exit_code: 139
      signal: 11
      verdict: crash_candidate
      notes: init and done return 1, then CRYPTO_secure_used SIGSEGVs
    initialized_then_used_control:
      exit_code: 0
      signal: null
      verdict: normal_defined_behavior
      notes: init returns 1, CRYPTO_secure_used returns 0, done returns 1
overall:
  tested_versions:
    - openssl-3.5.5
  versions_reproducing_crash:
    - openssl-3.5.5
  versions_not_reproducing_crash: []
  control_normal_versions:
    - openssl-3.5.5
  conclusion: >
    The only locally available OpenSSL version reproduces both crash cases while
    the initialized control succeeds. This strengthens the robustness /
    vulnerability-candidate signal, but does not remove the need for API
    contract confirmation.
