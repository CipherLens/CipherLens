  - slot_name: wc_FreeDecodedCert
    source_api: wc_FreeDecodedCert
    allowed_target_apis: []
    blocked_target_apis: []
    mapping_gate_status:
    - not_in_mapping_gate
    notes: candidate mapping only; not confirmed equivalence
  - slot_name: ASN1_item_d2i
    source_api: ''
    allowed_target_apis:
    - openssl:ASN1_item_d2i
    blocked_target_apis: []
    mapping_gate_status:
    - usable_for_adapter
    notes: candidate mapping only; not confirmed equivalence
  - slot_name: mbedtls_x509_crt_parse_der
