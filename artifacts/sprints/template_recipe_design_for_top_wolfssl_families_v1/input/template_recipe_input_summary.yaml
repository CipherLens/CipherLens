why_family_recipe_first:
- Top wolfSSL families have no existing family template and no wolfSSL source template.
- Family recipe defines must-preserve semantics, mutation slots, oracle style, and
  AST mask expectations before source template generation.
- Direct template generation would risk changing the vulnerability path or inventing
  C structure.
- This sprint emits recipe artifacts only; template_generalizer_v1 will later consume
  family recipe plus tree-sitter AST mask pipeline outputs.
strict_non_actions:
  generate_c_template: false
  run_poc: false
  compile_run: false
  render: false
  glm: false
