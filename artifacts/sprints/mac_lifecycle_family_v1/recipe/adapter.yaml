source_pattern_id: OPENSSL-ISSUE-22842
template_id: MAC_LIFECYCLE_V1_SOURCE_TEMPLATE
harness_family: mac_lifecycle
oracle_type: lifecycle_state_transition_semantic_oracle
target_library: cross_library
target_api: mac_lifecycle_pair
applicability: generate
adapter_recipe: adapter_recipes/openssl_mbedtls/mac_lifecycle.recipe_slot.yaml
evidence_file: artifacts/sprints/mac_lifecycle_family_v1/evidence/rag_issue_22842.json

slot_bindings:
  openssl_MAC_FETCH_API: EVP_MAC_fetch
  openssl_MAC_CTX_NEW_API: EVP_MAC_CTX_new
  openssl_MAC_INIT_API: EVP_MAC_init
  openssl_MAC_UPDATE_API: EVP_MAC_update
  openssl_MAC_FINAL_API: EVP_MAC_final
  openssl_MAC_FREE_API: EVP_MAC_CTX_free
  openssl_MAC_ALGORITHM: CMAC
  mbedtls_psa_MAC_SETUP_API: psa_mac_sign_setup
  mbedtls_psa_MAC_UPDATE_API: psa_mac_update
  mbedtls_psa_MAC_FINAL_API: psa_mac_sign_finish
  mbedtls_psa_MAC_ABORT_API: psa_mac_abort
  mbedtls_psa_MAC_ALGORITHM: PSA_ALG_CMAC

preserved_features:
  - MAC lifecycle state transitions are explicit.
  - repeated final and update-after-final are observable through return code and output length.
  - PSA bad-state style rejection is observable through psa_status_t.
  - OpenSSL permissive CMAC behavior is classified as semantic divergence candidate, not a confirmed bug.

lost_or_weakened_features:
  - This adapter does not reproduce provider-internal null dereference from OPENSSL-ISSUE-22842.
  - OpenSSL has no direct public PSA-style abort API, so abort_then_update has projection limitations on the OpenSSL side.

notes:
  - This is a lifecycle semantic divergence candidate, not a confirmed vulnerability.
  - Do not classify permissive OpenSSL behavior as a bug without documentation or caller-impact evidence.
  - LLM output is restricted to recipe-slot bindings; no free-form C blocks are accepted.

semantic_oracle:
  normal_init_update_final:
    expected: both_success
  repeated_final:
    openssl_observed: permissive_or_legacy_behavior
    psa_expected: bad_state_after_finish
    verdict_if_observed: behavior_divergence_candidate
  update_after_final:
    openssl_observed: permissive_or_legacy_behavior
    psa_expected: bad_state_after_finish
    verdict_if_observed: behavior_divergence_candidate
  abort_then_update:
    expected: strict_bad_state_or_error

_adapter_mode: recipe_slot_filling
_llm_status: manual_controlled_slot_binding
_ignored_disallowed_fields: []
_ignored_non_slot_fields: []
