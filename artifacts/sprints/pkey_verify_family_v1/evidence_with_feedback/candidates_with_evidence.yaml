- target_library: openssl
  target_api: EVP_DigestVerify
  library: openssl
  api: EVP_DigestVerify
  source_template_id: PK_VERIFY_EXT_OPAQUE_RSA_PSS_NULL_DEREF
  source_api: mbedtls_pk_verify_ext
  decision: generate
  migration_applicability: applicable
  applicability: strong_candidate
  scores:
    operation_family: 85
    function_behavior: 80
    parameter_structure: 75
    vulnerability_path: 72
    harness_feasibility: 85
    final: 78
  preserved_features:
  - EVP_PKEY is a polymorphic key dispatch layer analogous to mbedTLS PK context
  - EVP_DigestVerifyInit dispatches internally to RSA-specific or ECDSA-specific methods
  - passing an EC key to a verify operation that requests RSA-PSS padding replicates
    the incompatible key type scenario
  - EVP_PKEY_CTX_set_rsa_padding reachable from EVP_DigestVerifyInit dispatch path
  - return code oracle observable through all EVP_Digest* return values
  - ASAN or UBSAN crash oracle available through sanitizer-linked compilation
  - standalone harness constructable without TLS handshake
  preserved_vulnerability_features:
  - generic_polymorphic_key_context_dispatch
  - rsa_pss_specific_verification_path_or_rsa_dispatch_code
  - incompatible_or_mismatched_key_type_entry
  - observable_crash_vs_safe_error_return
  weakened_features:
  - OpenSSL EVP dispatch uses explicit pmeth type table; type check is more robust
    than the historical mbedTLS missing guard
  - PSA opaque key concept has no direct OpenSSL equivalent; replaced by EC key type
    mismatch scenario
  - modern OpenSSL (3.x) performs type validation at EVP_DigestVerifyInit or EVP_PKEY_CTX_set_rsa_padding
    so crash is unlikely on current version
  lost_or_weakened_features:
  - psa_opaque_key_mechanism
  - exact_mbedtls_error_code_value
  - exact_mbedtls_internal_type_guard_location
  migration_reason: 'Strongest target candidate. EVP_DigestVerify uses EVP_PKEY which
    is a generic key dispatch layer analogous to the mbedTLS PK context. By passing
    an EC key (incompatible type for RSA-PSS) and requesting RSA-PSS padding via EVP_PKEY_CTX_set_rsa_padding,
    the harness probes whether the OpenSSL dispatch safely rejects the incompatible
    type combination or crashes. The expected result on current OpenSSL 3.x is safe
    rejection, making this a migrated_safe result. This is a valid research outcome
    showing that OpenSSL has stronger type checking.

    '
  required_features:
  - generate RSA signing key and produce RSA-PSS signature with EVP_DigestSignInit
  - generate EC key (incompatible type for RSA-PSS)
  - call EVP_DigestVerifyInit with EC key and SHA-256 hash
  - call EVP_PKEY_CTX_set_rsa_padding with RSA_PKCS1_PSS_PADDING (probes dispatch)
  - observe return code at each step; process crash would be caught by ASAN
  - cleanup EVP_MD_CTX and EVP_PKEY objects
  notes:
  - The harness uses RSA_KEY_BITS parameterized by [KEY_BITS] to match source mutation.
  - Expected migration verdict is migrated_safe; both mbedTLS (fixed) and OpenSSL
    safely reject the incompatible key type.
