sprint: framework_automation_schema_unification_v1
why_stop_manual_family_push: Existing representative lines now cover A/B/C/D/blocking
  outcomes; the bottleneck is consistent scheduling, evidence gating, and feedback
  reuse rather than another hand-driven family.
family_route_coverage:
  mac_lifecycle: A_recipe_slot_cross_library_migration
  der_full_consumption: C_app_level_validation_gap
  secure_heap_state_lifecycle: B_controlled_family_mutation
  cipher_aead_lifecycle: B_controlled_family_mutation
  asn1_nested_boundary: blocked_seed_missing
why_schema_unification: Schemas let scheduler compare family readiness, route constraints,
  evidence strength, feedback, and claim limits consistently.
rag_accuracy_strategy: Prioritize official/source/test evidence, require source_file/layer
  metadata, demote metadata-only or ambiguous RAG, and block auto-render on weak evidence.
glm_limits: GLM only fills strict slot_bindings for A-path after gate pass; it cannot
  generate C, guess API contracts, or interpret sanitizer evidence.
legal_semantics_false_positive_control: Cross-library checks and official docs convert
  legal behavior to negative feedback and scheduler demotion.
seed_missing_policy: Missing real seed or placeholder-only input blocks D-path reproduction,
  crash claims, A-path escalation, and auto-render.
scheduler_scoring: Combines seed quality, oracle clarity, mapping clarity, mutation
  quality, positive signal, novelty, cost, negative feedback, seed missing, and external
  validation penalties.
auto_scheduler_v1: Reads pattern bank, scheduler seed, feedback, and poc pattern notes
  to emit family rerank, route, gates, GLM allowance, and next task.
auto_discovery_loop_v1_phases:
- auto scheduler only
- auto triage
- gated render/run
- high-value candidate handoff
vulnerability_found_this_sprint: false
next_task_name: auto_scheduler_v1
