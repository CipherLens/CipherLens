schema: pkey_sign_verify_case_matrix_v1
cases:
- case_id: openssl-system-cli__01_valid_sign_verify
  target: openssl-system-cli
  algorithm: rsa_sha256_pkcs1v15
  input_variant: valid_sign_verify
  expected_behavior: accept
  oracle_type: crypto_semantic_oracle
  adapter_name: sign_verify_adapter
  object_type: pkey_sign_verify_rsa_sha256
  input_description: Sign with a private key and verify with the matching public key.
  command_under_test: openssl-system-cli
- case_id: openssl-system-cli__02_modified_signature_verify
  target: openssl-system-cli
  algorithm: rsa_sha256_pkcs1v15
  input_variant: modified_signature_verify
  expected_behavior: reject
  oracle_type: negative_control_oracle
  adapter_name: negative_control_adapter
  object_type: pkey_sign_verify_rsa_sha256
  input_description: Verify a one-byte modified signature.
  command_under_test: openssl-system-cli
- case_id: openssl-system-cli__03_wrong_key_verify
  target: openssl-system-cli
  algorithm: rsa_sha256_pkcs1v15
  input_variant: wrong_key_verify
  expected_behavior: reject
  oracle_type: negative_control_oracle
  adapter_name: negative_control_adapter
  object_type: pkey_sign_verify_rsa_sha256
  input_description: Verify a valid signature with a non-matching public key.
  command_under_test: openssl-system-cli
- case_id: openssl-system-cli__04_wrong_message_verify
  target: openssl-system-cli
  algorithm: rsa_sha256_pkcs1v15
