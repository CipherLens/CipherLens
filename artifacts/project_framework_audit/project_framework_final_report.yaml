report_name: project_framework_final_report
one_sentence_definition: >
  Historical PoC/root-cause driven cross-library, cross-version, and same-family
  vulnerability-pattern migration and new-candidate discovery framework.
pipeline:
  - historical_poc_issue_patch
  - root_cause_mutation_oracle_extraction
  - pattern_bank
  - rag_evidence
  - scheduler_and_execution_path_planner
  - A_B_C_D_paths
  - render_compile_run_analyze
  - feedback_store
  - pattern_expansion
representative_results:
  mac_lifecycle:
    path: A
    status: full_a_path_compliant
    artifact: artifacts/migrations/mac_lifecycle_glm_full_a_path/
    interpretation: semantic divergence triage, not vulnerability claim
  der_full_consumption:
    path: C
    status: app_level_validation_gap_triage_complete
    artifact: artifacts/sprints/der_full_consumption_v2/
    interpretation: app-level semantic validation evidence, not crash claim
  secure_heap_state_lifecycle:
    path: D_then_B
    status: seed_validation_oracle_calibration
    artifact: artifacts/sprints/secure_heap_state_lifecycle_v1/
    interpretation: current-version robustness hardening candidate, not confirmed vulnerability or CVE
successes:
  - GLM strict recipe-slot A-path demonstrated end-to-end.
  - C-path app-level validation-gap triage is reproducible.
  - D-path crash evidence can promote a seed into B-path family validation.
  - Pattern bank, scheduler, RAG, and feedback loop are now connected.
drift_risks:
  - seed validation can become historical reproduction if expansion does not follow
  - family-specific renderers/analyzers need unification
  - version novelty should influence scheduler decisions
next_priority_families:
  - secure_heap_state_lifecycle
  - cipher_aead_lifecycle
  - asn1_nested_boundary
  - pkey_verify_semantic
recommend_pause_new_pocs_for_framework_cleanup: true
commit_recommendation:
  commit:
    - project_framework_audit reports
    - framework_alignment_audit milestone reports
    - pattern_bank and raw pattern docs
    - compact feedback and scheduler outputs
  do_not_commit_or_split:
    - build binaries
    - bulky repeated logs
    - cache files
    - local tool outputs not needed for reproducibility
