artifact_layers:
  pattern_bank:
    path: artifacts/pattern_bank/
    role: canonical generated knowledge and scheduler seed
    type: input_and_intermediate
    recommend_commit: true
    contains_logs_or_build: false
    split_commit: pattern_bank_update
    gitignore_candidate: false
  rag_sources:
    path: knowledge_raw/poc_patterns/
    role: raw pattern docs indexed by RAG
    type: input
    recommend_commit: true
    contains_logs_or_build: false
    split_commit: raw_pattern_docs
    gitignore_candidate: false
  feedback:
    path: artifacts/feedback/
    role: observed verdict feedback for scheduler/pattern expansion
    type: intermediate_evidence
    recommend_commit: true
    contains_logs_or_build: false
    split_commit: feedback_update
    gitignore_candidate: false
  execution_plan:
    path: artifacts/execution_plan/
    role: A/B/C/D route planner output
    type: report
    recommend_commit: true
    contains_logs_or_build: false
    split_commit: execution_plan
    gitignore_candidate: false
  a_path:
    path: artifacts/migrations/mac_lifecycle_glm_full_a_path/
    role: completed full A-path representative
    type: final_report_and_results
    recommend_commit: true
    contains_logs_or_build: true
    split_commit: mac_full_a_path
    gitignore_candidate: logs and build outputs only
  c_path:
    path: artifacts/sprints/der_full_consumption_v2/
    role: app-level DER validation-gap triage
    type: final_report_and_rendered_cases
    recommend_commit: partial
    contains_logs_or_build: rendered inputs/cases
    split_commit: der_c_path
    gitignore_candidate: generated run logs/build cache if any
  d_b_path:
    path: artifacts/sprints/secure_heap_state_lifecycle_v1/
    role: D-then-B seed validation and robustness qualification
    type: evidence_and_reports
    recommend_commit: partial
    contains_logs_or_build: true
    split_commit: secure_heap_qualification
    gitignore_candidate: build binaries, gdb logs if too large, repeated logs
  framework_alignment:
    path: artifacts/framework_alignment_audit/
    role: framework status and resume RAG rebuild report
    type: report
    recommend_commit: true
    contains_logs_or_build: rag_builder logs
    split_commit: framework_alignment
    gitignore_candidate: bulky logs if regenerated often
  rag_validation:
    path: artifacts/rag_rebuild_validation/
    role: RAG query validation outputs
    type: validation_evidence
    recommend_commit: true
    contains_logs_or_build: false
    split_commit: rag_validation
    gitignore_candidate: false
