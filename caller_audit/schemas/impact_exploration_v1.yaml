schema: cipherlens_impact_exploration_schema_v1
artifact_schema: cipherlens_impact_exploration_v1
context_pack_schema: cipherlens_candidate_context_pack_v1
required_result_fields:
  - candidate_id
  - summary
  - findings
  - evidence
  - confidence
  - caller_chain
  - guards
  - propagation
  - unknowns
field_types:
  candidate_id:
    type: string
  summary:
    type: string
  findings:
    type: array
    items:
      type: string
  evidence:
    type: array
    items:
      type: string
  confidence:
    type: string
  caller_chain:
    type: array
    items:
      type: string
  guards:
    type: array
    items:
      type: string
  propagation:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  unknowns:
    type: array
    items:
      type: string
allowed_confidence:
  - low
  - medium
  - high
  - unknown
additional_result_fields: false
claim_policy:
  runner_assigns_status: false
  vulnerability_inference: false
  security_impact_inference: false
