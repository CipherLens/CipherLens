schema: cipherlens_security_impact_schema_v1
artifact_schema: cipherlens_security_impact_v1
context_pack_schema: cipherlens_candidate_context_pack_v1
impact_exploration_schema: cipherlens_impact_exploration_v1
exploitability_schema: cipherlens_exploitability_v1
required_result_fields:
  - candidate_id
  - security_classification
  - affected_security_properties
  - impact_evidence
  - confidence
  - unknowns
field_types:
  candidate_id:
    type: string
  security_classification:
    type: string
    enum:
      - potential_security_impact
      - semantic_gap
      - api_contract_issue
      - insufficient_evidence
  affected_security_properties:
    type: array
    items:
      type: string
  impact_evidence:
    type: array
    items:
      type: string
  confidence:
    type: string
    enum:
      - low
      - medium
      - high
      - unknown
  unknowns:
    type: array
    items:
      type: string
additional_result_fields: false
claim_policy:
  runner_assigns_vulnerability: false
  vulnerability_inference: false
  cve_inference: false
  security_impact_is_assessment_only: true
