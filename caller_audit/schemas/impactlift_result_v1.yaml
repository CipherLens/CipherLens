schema: cipherlens_impactlift_result_schema_v1
artifact_schema: cipherlens_impactlift_result_v1
context_pack_schema: cipherlens_candidate_context_pack_v1
required_result_fields:
  - candidate_id
  - caller_chain
  - guards
  - propagation
  - security_semantics
  - evidence
  - confidence
  - status
field_types:
  candidate_id: string
  caller_chain: list
  guards: list
  propagation: mapping
  security_semantics: list
  evidence: list
  confidence: string
  status: string
allowed_status:
  - BLOCKED
  - PROPAGATED
  - IMPACT_CANDIDATE
  - UNCERTAIN
allowed_confidence:
  - low
  - medium
  - high
  - unknown
additional_result_fields: false
claim_policy:
  runner_assigns_status: false
  vulnerability_inference: false
  security_impact_inference: false

