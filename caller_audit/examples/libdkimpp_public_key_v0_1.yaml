schema: cipherlens_caller_audit_config_v0_1

project:
  name: halon/libdkimpp
  repo_path: "${LIBDKIMPP_ROOT}"
  repository_url: "https://github.com/halon/libdkimpp.git"
  expected_commit: "9defa162eebc644b006b7a51e92162640a810ee9"

candidate:
  source_case: "MBEDTLS-POC-0020"
  source_pattern: "top_level_der_trailing_data"
  target_library: "openssl"
  target_api: "d2i_PUBKEY"
  component: "DKIM::PublicKey::Parse"
  crypto_backend: "OpenSSL 3.5.5"
  input_object: "DKIM DNS TXT p= public-key field"

scan:
  api_patterns:
    - '\bd2i_PUBKEY\s*\('
  include_globs:
    - "src/**/*.cpp"
    - "src/**/*.hpp"
  exclude_globs:
    - "build*/**"
  test_markers:
    - "/test/"
    - "/tests/"
    - "/tools/"
  context_lines: 15
  full_consumption_patterns:
    - '\btmp2\s*==\s*tmp_end\b'
    - '\btmp2\s*!=\s*tmp_end\b'
    - '\btmp2\s*==\s*[^;\n]+\+\s*tmp\.size\(\)'
    - '\btmp2\s*!=\s*[^;\n]+\+\s*tmp\.size\(\)'

environment:
  LIBDKIMPP_ROOT: "${LIBDKIMPP_ROOT}"
  LIBDKIMPP_FIX_SRC: "${LIBDKIMPP_FIX_SRC}"
  OPENSSL_ROOT: "${OPENSSL_ROOT}"
  BASELINE_HARNESS_BUILD: "${BASELINE_HARNESS_BUILD}"
  FIX_HARNESS_BUILD: "${FIX_HARNESS_BUILD}"
  ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
  UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

commands:
  - name: prepare_fix_control_worktree
    cwd: "{config_dir}/../.."
    command: >
      PYTHONPATH=. python3 -m caller_audit.worktree
      --repo "${LIBDKIMPP_ROOT}"
      --commit "9defa162eebc644b006b7a51e92162640a810ee9"
      --worktree "${LIBDKIMPP_FIX_SRC}"
      --patch "caller_audit/fix_controls/libdkimpp_public_key_full_consumption.patch"
    timeout_seconds: 600

  - name: configure_baseline_harness
    cwd: "{config_dir}/../.."
    command: >
      rm -rf "${BASELINE_HARNESS_BUILD}" &&
      cmake
      -S caller_audit/harnesses/libdkimpp_public_key
      -B "${BASELINE_HARNESS_BUILD}"
      -G Ninja
      -DCMAKE_BUILD_TYPE=Debug
      -DCMAKE_CXX_COMPILER=clang++
      -DLIBDKIMPP_ROOT="${LIBDKIMPP_ROOT}"
      -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}"
      -DOPENSSL_INCLUDE_DIR="${OPENSSL_ROOT}/include"
      -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_ROOT}/libcrypto.a"
      -DOPENSSL_SSL_LIBRARY="${OPENSSL_ROOT}/libssl.a"
    timeout_seconds: 600

  - name: build_baseline_harness
    cwd: "{config_dir}/../.."
    command: 'cmake --build "${BASELINE_HARNESS_BUILD}" -j4'
    timeout_seconds: 1800

  - name: run_caller_harness
    cwd: "{config_dir}/../.."
    command: '"${BASELINE_HARNESS_BUILD}/libdkimpp_public_key_audit"'
    timeout_seconds: 300

  - name: configure_fix_harness
    cwd: "{config_dir}/../.."
    command: >
      rm -rf "${FIX_HARNESS_BUILD}" &&
      cmake
      -S caller_audit/harnesses/libdkimpp_public_key
      -B "${FIX_HARNESS_BUILD}"
      -G Ninja
      -DCMAKE_BUILD_TYPE=Debug
      -DCMAKE_CXX_COMPILER=clang++
      -DLIBDKIMPP_ROOT="${LIBDKIMPP_FIX_SRC}"
      -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}"
      -DOPENSSL_INCLUDE_DIR="${OPENSSL_ROOT}/include"
      -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_ROOT}/libcrypto.a"
      -DOPENSSL_SSL_LIBRARY="${OPENSSL_ROOT}/libssl.a"
    timeout_seconds: 600

  - name: build_fix_harness
    cwd: "{config_dir}/../.."
    command: 'cmake --build "${FIX_HARNESS_BUILD}" -j4'
    timeout_seconds: 1800

  - name: run_fix_control_harness
    cwd: "{config_dir}/../.."
    command: '"${FIX_HARNESS_BUILD}/libdkimpp_public_key_audit"'
    timeout_seconds: 300

dynamic:
  baseline_command: run_caller_harness
  fix_control_command: run_fix_control_harness

  baseline_phase:
    baseline_case: canonical
    baseline_required:
      accepted: true
      canonical_roundtrip: true
      public_key_equal: true
      signature_verifies: true
    mutation_cases:
      - tail_0500
      - tail_3000
      - tail_020100
    expected_mutation_count: 3
    mutation_required:
      accepted: true
      input_differs: true
      canonical_roundtrip: true
      public_key_equal: true
      signature_verifies: true

  fix_control_phase:
    baseline_case: canonical
    baseline_required:
      accepted: true
      canonical_roundtrip: true
      public_key_equal: true
      signature_verifies: true
    mutation_cases:
      - tail_0500
      - tail_3000
      - tail_020100
    expected_mutation_count: 3
    mutation_required:
      accepted: false
      input_differs: true
      canonical_roundtrip: false
      public_key_equal: false
      signature_verifies: false

reachability:
  public_api_exposed: true
  production_reachable: true
  attacker_controlled_input: true
  official_protocol_route_found: true
  security_impact_demonstrated: false
  notes:
    - >
      DKIM public-key material is obtained from DNS TXT and passed through
      PublicKey::Parse to d2i_PUBKEY before RSA signature verification.
    - >
      A remote sender can publish a non-canonical key record for a domain it
      controls, but no victim-domain impersonation or policy bypass has been
      demonstrated.
