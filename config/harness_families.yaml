object_state_lifecycle:
  oracle_types:
    - stale_pointer_length_state_oracle
    - object_lifecycle_state_oracle
    - mac_context_size_lifecycle_oracle
  required_observables:
    - update_return_code_or_pointer
    - object_state_transition
    - crash_or_sanitizer_signal
    - context_size_or_return_code
  target_api_features:
    - mutable_object_with_internal_buffer
    - repeated_update_of_same_object
    - zero_length_update_semantics
    - return_code_or_pointer_observable
    - context_setup_state_transition
    - initialized_size_query
  safe_behavior:
    condition: zero-length update or pre-setup context use leaves consistent state; later initialized use does not crash
    description: object lifecycle transitions are handled safely, including pre-setup MAC context use and initialized size query
  bug_behavior:
    condition: ASAN/SEGV/NULL deref or exit 139 after invalid object lifecycle transition
    description: stale or uninitialized object state causes NULL pointer dereference on reuse or context operation
  triage_behavior:
    condition: unexpected return code but no crash
    description: behavior differs from source oracle but no memory safety violation; needs manual review

invalid_parameter_setup_oracle:
  oracle_types:
    - invalid_aead_tag_length_oracle
    - invalid_parameter_return_code_oracle
  required_observables:
    - setup_or_ctrl_return_code
    - parameter_value
    - invalid_parameter_indicator
  target_api_features:
    - setup_or_ctrl_api_for_parameter_validation
    - algorithm_specific_parameter_constraints
    - return_code_observable_at_setup_time
  safe_behavior:
    condition: invalid parameter rejected with error return code
    description: target API correctly rejects invalid parameter at setup/ctrl time
  bug_behavior:
    condition: invalid parameter accepted with success return code
    description: target API accepts invalid parameter that should be rejected
  triage_behavior:
    condition: setup/init step failed before reaching the parameter validation
    description: validation path not reached; needs oracle tightening

buffer_canary_boundary:
  oracle_types:
    - canary_boundary_oracle

der_pointer_consumption:
  oracle_types:
    - pointer_consumption_semantic_oracle

x509_asn1_inner_boundary:
  oracle_types:
    - inner_asn1_boundary_semantic_oracle

return_code_outlen_semantic:
  oracle_types:
    - invalid_padding_output_length_oracle
  required_observables:
    - return_code
    - output_length
    - error_path_state
  target_api_features:
    - finalization_api
    - invalid_padding_path
    - caller_visible_output_length
    - output_buffer_or_output_length_pointer

bignum_arithmetic_semantic:
  oracle_types:
    - bignum_negative_result_rejection_oracle
  required_observables:
    - return_code
    - result_bignum
    - operand_relation
    - arithmetic_result_state
  target_api_features:
    - bignum_arithmetic_api
    - subtraction_operation
    - caller_visible_return_code
    - caller_visible_result_object
  limitations:
    - OpenSSL 3.x BIGNUM is opaque and cannot expose direct limb-boundary canary behavior.

crash_sanitizer_oracle:
  oracle_types:
    - heap_underflow_sanitizer_oracle
    - heap_overflow_sanitizer_oracle
    - generic_sanitizer_crash_oracle
  required_observables:
    - asan_or_ubsan_signal
    - process_exit_code
    - return_code_or_null_pointer
  target_api_features:
    - parser_or_decoder_entrypoint
    - attacker_controlled_input_bytes
    - internal_memory_access_from_decoded_content
    - return_code_or_null_pointer_observable
  safe_behavior:
    condition: return_code != 0 or return_pointer == NULL and no ASAN/UBSAN signal
    description: target safely rejects malformed input without memory safety violation
  bug_behavior:
    condition: ASAN/UBSAN crash or SEGV or exit 139
    description: target exhibits memory safety violation on malformed input path
  triage_behavior:
    condition: return success unexpectedly
    description: malformed input accepted; oracle needs strengthening

null_deref_dispatch:
  oracle_types:
    - crash_sanitizer_or_safe_error_oracle
  required_observables:
    - return_code
    - crash_signal_or_asan_output
    - dispatch_path_entry
  target_api_features:
    - polymorphic_key_or_object_dispatch
    - type_specific_internal_code_path
    - incompatible_key_or_object_type_constructable
    - return_code_or_sanitizer_observable
  safe_behavior:
    condition: return_code <= 0 at any dispatch step
    description: target safely rejects incompatible key or object type before internal dereference
  bug_behavior:
    condition: process crash with ASAN/UBSAN/SEGV/exit 139
    description: target dispatches into type-specific code without type guard and crashes
  triage_behavior:
    condition: return_code > 0 unexpectedly
    description: incompatible key type accepted without crash; needs oracle tightening

pkey_capability_mismatch_oracle:
  oracle_types:
    - public_key_sign_rejection_oracle
    - capability_mismatch_safe_error_oracle
    - rsa_invalid_key_sign_rejection_oracle
  required_observables:
    - sign_return_code
    - crash_signal_or_asan_output
    - key_capability_flags
  target_api_features:
    - asymmetric_signing_api
    - public_only_key_constructable
    - invalid_or_tiny_private_key_constructable
    - key_usage_or_capability_check
    - return_code_observable
    - no_private_key_component
  safe_behavior:
    condition: sign returns error code AND no crash AND signing does not succeed
    description: >
      Target library safely rejects signing attempt with a public-only key or
      invalid/tiny private key material.
      Correct behavior: return error code (e.g. PSA_ERROR_NOT_PERMITTED,
      PSA_ERROR_INVALID_ARGUMENT, MBEDTLS_ERR_PK_TYPE_MISMATCH, or equivalent)
      without crash.
  bug_behavior:
    condition: ASAN/UBSAN crash or SEGV or exit 139 during signing with invalid key material
    description: >
      Target library attempts to sign with public-only or invalid/tiny key material
      and dereferences invalid private key state, causing crash or undefined behavior.
  triage_behavior:
    condition: sign returns success (0 or PSA_SUCCESS) with invalid key material
    description: >
      Signing succeeded with public-only or invalid/tiny RSA key material. This is
      a semantic violation requiring manual review.
      May indicate incorrect key policy setup in harness.
