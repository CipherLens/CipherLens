libraries:
  mbedtls:
    version: "4.1.0"
    root: "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0"
    include_dirs:
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/include"
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/tf-psa-crypto/include"
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/tf-psa-crypto/drivers/builtin/include"
    source_dirs:
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/tf-psa-crypto/drivers/builtin/src"
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/tf-psa-crypto/core"
    test_dirs:
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/tf-psa-crypto/tests/suites"
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/tests"
      - "${CLEAN_SOURCES_ROOT}/mbedtls-4.1.0/programs"
    focus_keywords:
      - "mbedtls_mpi_write_string"
      - "mbedtls_mpi_write_binary"
      - "mbedtls_mpi_read_string"
      - "mbedtls_mpi_lset"
      - "mbedtls_mpi_init"
      - "mbedtls_mpi_free"

  openssl:
    version: "3.5.5"
    root: "${CLEAN_SOURCES_ROOT}/openssl-3.5.5"
    include_dirs:
      - "${CLEAN_SOURCES_ROOT}/openssl-3.5.5/include"
    source_dirs:
      - "${CLEAN_SOURCES_ROOT}/openssl-3.5.5/crypto/bn"
    test_dirs:
      - "${CLEAN_SOURCES_ROOT}/openssl-3.5.5/test"
      - "${CLEAN_SOURCES_ROOT}/openssl-3.5.5/demos"
      - "${CLEAN_SOURCES_ROOT}/openssl-3.5.5/apps"
    focus_keywords:
      - "BN_bn2binpad"
      - "BN_bn2bin"
      - "BN_bn2hex"
      - "BN_bn2dec"
      - "BN_set_negative"
      - "BN_set_word"
      - "BN_new"
      - "BN_free"

  botan:
    version: "3.10.0"
    root: "${CLEAN_SOURCES_ROOT}/botan-3.10.0"
    include_dirs:
      - "${CLEAN_SOURCES_ROOT}/botan-3.10.0/src/lib/math/bigint"
    source_dirs:
      - "${CLEAN_SOURCES_ROOT}/botan-3.10.0/src/lib/math/bigint"
    test_dirs:
      - "${CLEAN_SOURCES_ROOT}/botan-3.10.0/src/tests"
    focus_keywords:
      - "BigInt::encode"
      - "BigInt::serialize_to"
      - "to_dec_string"
      - "to_hex_string"
      - "BigInt::decode"

wycheproof:
  root: "/home/wen/work/wycheproof_sources/wycheproof"
  testvectors_dir: "/home/wen/work/wycheproof_sources/wycheproof/testvectors_v1"
