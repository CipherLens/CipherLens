generated_by: taxonomy_review_and_card_priority_v1
status: poc_driven_taxonomy_reviewed
note: Framework families are harness/oracle-level categories. Concrete patterns are derived from PoC/issue/template/recipe
  evidence and should not be treated as complete support claims.
framework_families:
- id: buffer_canary_boundary
  description: caller-provided buffer, explicit length, truncation, overwrite, out-of-bounds write, underflow,
    or canary-after-buffer boundary behavior
  oracle_types:
  - crash_sanitizer_oracle
  - canary_boundary_oracle
  - return_code_outlen_semantic
  typical_mutations:
  - boundary_length
  - truncation
  - padding_length
  - output_buffer_size
  - serialized_value_size
- id: der_pointer_consumption
  description: DER parser accepts input without consuming all bytes, accepts trailing garbage, or exposes
    pointer-consumption differences
  oracle_types:
  - parser_full_consumption
  - pointer_consumption_semantic_oracle
  - differential_oracle
  typical_mutations:
  - trailing_garbage
  - truncated_der
  - length_field_mutation
  - valid_prefix_plus_tail
- id: x509_asn1_inner_boundary
  description: nested ASN.1/X.509 structures, certificate/container substructure boundaries, text-field/date/extension
    parsing, and inner parser bounds
  oracle_types:
  - parser_oracle
  - differential_oracle
  - crash_sanitizer_oracle
  typical_mutations:
  - nested_length_field
  - x509_extension_length
  - malformed_certificate_field
  - oversized_asn1_time
  - string_field_boundary
- id: return_code_outlen_semantic
  description: return-code and caller-visible output length/output buffer semantic consistency
  oracle_types:
  - crypto_semantic_oracle
  - invalid_padding_output_length_oracle
  - differential_oracle
  typical_mutations:
  - invalid_padding
  - output_length_pointer
  - error_path_state
  - finalization_boundary
- id: crash_sanitizer_oracle
  description: sanitizer-visible crash, abort, invalid memory access, assertion failure, or memory-safety
    observation layer
  oracle_types:
  - execution_oracle
  - crash_sanitizer_oracle
  typical_mutations:
  - malformed_input_seed
  - oversized_internal_field
  - invalid_serialized_state
  - cleanup_path_error
- id: object_state_lifecycle
  description: object lifecycle, state-machine ordering, stale pointer/stale length, uninitialized context,
    copy/dup/init/update/final/free sequencing
  oracle_types:
  - lifecycle_oracle
  - crypto_semantic_oracle
  - crash_sanitizer_oracle
  typical_mutations:
  - missing_init
  - duplicate_uninitialized_context
  - stale_length_after_zero_update
  - cleanup_after_error
  - public_private_state_mismatch
- id: null_deref_dispatch
  description: NULL pointer, invalid object type, method dispatch mismatch, public-only key misuse, or
    type-specific dispatch failure
  oracle_types:
  - execution_oracle
  - lifecycle_oracle
  - crash_sanitizer_or_safe_error_oracle
  typical_mutations:
  - wrong_key_type
  - public_key_used_for_private_operation
  - missing_method_callback
  - null_internal_pointer
- id: protocol_policy_semantic
  description: protocol, certificate, key-usage, signature-policy, setup-parameter, or container-level
    semantic checks where the main oracle is accept/reject consistency rather than pointer consumption,
    crash, or lifecycle state
  oracle_types:
  - crypto_semantic_oracle
  - differential_oracle
  - protocol_policy_oracle
  typical_mutations:
  - policy_flag_mutation
  - key_usage_mutation
  - signature_algorithm_mismatch
  - invalid_attribute_combination
  - invalid_setup_parameter
