# Family-aware AST-lite selection rules.
# These rules keep ast_mask_select.py data-driven while preserving its built-in
# fallback behavior when this file is absent or incomplete.

default:
  context_keywords:
    - canary
    - prepare_output_with_canary
    - buffer
    - buf
    - limb
    - X->p
    - X->n
    - raw
    - CANARY_SIZE
    - BUFLEN
  preferred_roles:
    - mutation_point
    - trigger_call
    - oracle
    - input_preparation
    - helper_function
    - cleanup
  context_limit: 12
  cleanup_limit: 2

buffer_canary_boundary:
  context_keywords:
    - canary
    - prepare_output_with_canary
    - buffer
    - buf
    - CANARY_SIZE
    - BUFLEN
    - output
    - memset
  oracle_variables:
    - ret
    - buf
    - canary
  preferred_roles:
    - mutation_point
    - trigger_call
    - oracle
    - input_preparation
    - cleanup
  context_limit: 12
  cleanup_limit: 2

der_pointer_consumption:
