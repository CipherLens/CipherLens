$schema: https://json-schema.org/draft/2020-12/schema
$id: cipherlens.trigger_template_interface.v0.1
title: CipherLens Trigger Template Interface Manifest v0.1
type: object
additionalProperties: false
required: [schema_version, manifest_id, trigger_template_ref, trigger_template_digest, interface_version, slots, source_mapping, provenance]
properties:
  schema_version: {const: cipherlens.trigger_template_interface.v0.1}
  manifest_id: {type: string}
  trigger_template_ref: {type: string}
  trigger_template_digest: {$ref: '#/$defs/sha256'}
  interface_version: {const: v0.1}
  slots:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/slot'}
  source_mapping:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/mapping'}
  provenance: {$ref: '#/$defs/provenance'}
$defs:
  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  slot:
    type: object
    additionalProperties: false
    required: [slot_ref, slot_kind, required, multiplicity, source_locator, legacy_source_refs, semantic_role_hint, dependencies, provenance]
    properties:
      slot_ref: {type: string}
      slot_kind: {enum: [INPUT, OBJECT, OPERATION, INTERVENTION, OBSERVATION, ORDER_ANCHOR, STATE_ANCHOR]}
      required: {type: boolean}
      multiplicity: {enum: [ONE, ZERO_OR_ONE, ONE_OR_MORE, ZERO_OR_MORE]}
      source_locator:
        type: object
        additionalProperties: false
        required: [artifact_ref, selector_kind, selector_value, line_start, line_end]
        properties:
          artifact_ref: {type: string}
          selector_kind: {type: string}
          selector_value: {type: string}
          line_start: {type: [integer, 'null'], minimum: 1}
          line_end: {type: [integer, 'null'], minimum: 1}
      legacy_source_refs: {type: array, minItems: 1, items: {type: string}}
      semantic_role_hint: {type: string}
      dependencies: {type: array, items: {type: string}}
      provenance:
        type: object
        additionalProperties: false
        required: [source_kind, source_digest]
        properties:
          source_kind: {type: string}
          source_digest: {$ref: '#/$defs/sha256'}
  mapping:
    type: object
    additionalProperties: false
    required: [slot_ref, legacy_source_ref]
    properties:
      slot_ref: {type: string}
      legacy_source_ref: {type: string}
  provenance:
    type: object
    additionalProperties: false
    required: [producer, adapter_version, source_artifact_refs]
    properties:
      producer: {type: string}
      adapter_version: {type: string}
      source_artifact_refs: {type: array, minItems: 1, items: {type: string}}
