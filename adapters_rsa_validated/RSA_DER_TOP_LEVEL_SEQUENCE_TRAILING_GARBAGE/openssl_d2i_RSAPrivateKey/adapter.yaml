target_library: openssl
target_api: d2i_RSAPrivateKey
applicability: generate
include_headers:
- openssl/rsa.h
- openssl/evp.h
type_mapping:
  mbedtls_pk_context / RSA private DER parser: RSA * returned by d2i_RSAPrivateKey
  source DER buffer: const unsigned char *p cursor over der
constant_mapping:
  '[DER_KIND]': select private/public DER fixture
  '[TRAILING_GARBAGE_BYTES]': bytes appended after the complete top-level DER object
  '[TRAILING_GARBAGE_LEN]': number of appended trailing bytes
  '[EXPECT_RET]': OpenSSL uses NULL/non-NULL return and pointer consumption instead
    of exact mbedTLS error code
init_block: 'RSA *rsa = NULL;

  const unsigned char *p = NULL;

  long consumed_len = 0;'
input_construction_block: 'p = der;

  consumed_len = 0;'
trigger_block: 'rsa = d2i_RSAPrivateKey(NULL, &p, der_len);

  ret = (rsa != NULL) ? 0 : -1;

  consumed_len = (long)(p - der);'
return_value_semantics: Pointer-returning OpenSSL d2i API. Adapter converts pointer
  success into ret=0 and failure into ret=-1 for harness compatibility.
oracle_strategy:
  memory_safety:
  - No crash or sanitizer failure during DER decode.
  semantic_checks:
  - Check decoded object pointer is non-NULL or NULL.
  - 'Check pointer advancement: p == der + der_len means exact full consumption.'
  - If decoded object is non-NULL but p < der + der_len, the parser accepted a valid
    DER object while leaving trailing garbage unconsumed.
  - Use pointer consumption as the exact-consumption oracle for trailing-garbage behavior.
  bug_signals:
  - Decoded object is non-NULL while p < der + der_len, indicating accepted object
    with trailing garbage still present.
  safe_signals:
  - Decode rejects malformed trailing-garbage input, or exact-consumption policy reports
    p != der + der_len as unsafe.
cleanup_block: RSA_free(rsa);
preserved_features:
- DER key parser
- caller-controlled DER buffer and explicit input length
- valid object followed by appended trailing garbage
- return pointer success/failure oracle
- pointer advancement oracle via const unsigned char **ppin
- RSA private key path
- PKCS#1 RSAPrivateKey top-level ASN.1 SEQUENCE
lost_or_weakened_features:
- exact mbedTLS MBEDTLS_ERR_RSA_BAD_INPUT_DATA return code is not preserved
- OpenSSL d2i APIs may successfully decode the first object and leave p before der
  + der_len, so harness must explicitly check pointer consumption
notes:
- This adapter is for RSA DER trailing-garbage migration, not for bignum buffer-boundary
  testing.
- The source harness should provide der and der_len after constructing DER with trailing
  garbage.
- The adapter uses a local const unsigned char *p cursor so pointer advancement can
  be observed.
_llm_status: ok_repaired
_repair_reason: Normalized pointer-returning OpenSSL d2i adapter for RSA DER trailing-garbage
  harness.
validation:
  status: ok
  errors: []
  warnings: []
  normalized: true
