api: mbedtls_pk_verify
library: mbedtls
family: pkey_verify
signature: "int mbedtls_pk_verify(mbedtls_pk_context *ctx, mbedtls_md_type_t md_alg, const unsigned char *hash, size_t hash_len, const unsigned char *sig, size_t sig_len)"
parameter_semantics:
  ctx: public key context used for signature verification
  md_alg: message digest algorithm identifier
  hash: digest bytes to verify
  hash_len: digest length
  sig: signature bytes
  sig_len: signature length
return_value_semantics:
  success: 0
  invalid_signature_or_error: negative mbedTLS error code
state_preconditions:
  - ctx must contain a parsed public key with verify capability
  - md_alg and hash_len must match the expected digest semantics for the key algorithm
valid_invalid_ranges:
  valid: signature generated by matching private key over matching digest
  invalid: wrong digest, wrong hash length, wrong key, malformed signature
unsupported_conditions:
  - incompatible key type
  - unsupported md_alg for key algorithm
  - malformed public key context
related_apis:
  - mbedtls_pk_verify_ext
  - mbedtls_pk_parse_public_key
  - mbedtls_pk_free
  - psa_verify_hash
mutation_hints:
  - wrong digest algorithm
  - wrong hash length
  - all-zero signature
  - truncated signature
  - wrong public key
  - RSA-PSS versus PKCS1 v1.5 padding mismatch through mbedtls_pk_verify_ext
oracle_observables:
  - return_code
  - sanitizer_signal
  - signature_acceptance
known_pitfalls:
  - mbedTLS negative returns must be separated into safe rejection, unsupported feature, and crash/sanitizer evidence
  - md_alg and hash_len mismatch can reject before reaching signature mathematics
source_references:
  - mbedtls/pk.h
notes:
  - Use this card for mbedTLS-side controlled signature verification semantics, distinct from the opaque-key null-deref pattern.
