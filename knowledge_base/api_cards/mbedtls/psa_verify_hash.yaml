api: psa_verify_hash
library: mbedtls
family: pkey_verify
signature: "psa_status_t psa_verify_hash(psa_key_id_t key, psa_algorithm_t alg, const uint8_t *hash, size_t hash_length, const uint8_t *signature, size_t signature_length)"
parameter_semantics:
  key: PSA key identifier with verify permission
  alg: signature algorithm
  hash: hash bytes
  hash_length: hash length
  signature: signature bytes
  signature_length: signature length
return_value_semantics:
  success: PSA_SUCCESS
  invalid_signature: PSA_ERROR_INVALID_SIGNATURE
  error: PSA error status
state_preconditions:
  - PSA crypto subsystem initialized
  - key imported or generated with verify usage
valid_invalid_ranges:
  valid: compatible key, algorithm, hash, and signature
  invalid: wrong signature, wrong algorithm, incompatible key
unsupported_conditions:
  - missing key permission
  - unsupported algorithm
related_apis:
  - psa_crypto_init
  - psa_import_key
  - psa_destroy_key
mutation_hints:
  - wrong key usage flags
  - algorithm/key mismatch
  - shortened signature
  - wrong hash length
oracle_observables:
  - psa_status
  - sanitizer_signal
  - error_class
source_references:
  - psa/crypto.h
notes:
  - "Known pitfall: invalid signature and API misuse are separate semantic classes."

