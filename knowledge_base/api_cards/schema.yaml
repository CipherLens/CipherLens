schema_version: api_card_v0
required_fields:
  - api
  - library
  - family
  - signature
  - parameter_semantics
  - return_value_semantics
  - state_preconditions
  - valid_invalid_ranges
  - unsupported_conditions
  - related_apis
  - mutation_hints
  - oracle_observables
  - source_references
  - notes
field_notes:
  parameter_semantics: Map argument names to roles such as input buffer, output buffer, length, object context, or consumed pointer.
  mutation_hints: Concrete mutation families that preserve the vulnerability path.
  oracle_observables: Signals that a harness can measure without guessing.
  notes: Include known pitfalls and caller obligations.

