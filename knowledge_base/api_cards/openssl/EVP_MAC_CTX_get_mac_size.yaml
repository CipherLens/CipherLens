api: EVP_MAC_CTX_get_mac_size
library: openssl
family: mac_lifecycle
signature: "size_t EVP_MAC_CTX_get_mac_size(EVP_MAC_CTX *ctx)"
parameter_semantics:
  ctx: MAC context
return_value_semantics:
  success: returns MAC output size
  failure_or_unknown: may return 0
state_preconditions:
  - context should have selected MAC implementation and parameters
valid_invalid_ranges:
  valid: initialized or parameterized MAC context
  invalid: uninitialized, freed, or unsupported context state
unsupported_conditions:
  - stale or NULL context
related_apis:
  - EVP_MAC_fetch
  - EVP_MAC_CTX_new
  - EVP_MAC_init
mutation_hints:
  - get size before setup
  - get size after failed init
  - get size after final
  - get size after abort-like cleanup
  - query after final
  - query after abort
oracle_observables:
  - returned_size
  - error_stack
  - sanitizer_signal
source_references:
  - openssl/evp.h
notes:
  - "Known pitfall: size query behavior depends on lifecycle state."
  - "Feedback: query-after-final and query-after-abort are MAC lifecycle follow-up mutations, while PSA query-size-before-setup has no public equivalent."
  - "Classification guidance: size-query differences after CMAC final/abort should be triaged as lifecycle_semantic_divergence_candidate, allowed_legacy_semantics_needs_review, or projection_limitation depending on source/target observability."
known_pitfalls:
  - Do not treat a nonzero returned_size alone as a crash or confirmed vulnerability.
  - query_size_before_setup is a projection limitation for mbedTLS PSA MAC because there is no public pre-setup size query equivalent.
