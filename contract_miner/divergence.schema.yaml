schema_version: cipherlens.divergence.v0_1
required_top_level: [schema_version, divergence_id, source_pair, intervention_refs, evidence_refs, deltas, provenance]
enums:
  pair_kinds: [same_library_fix]
  comparisons: [equal, not_equal, only_buggy, only_fixed, trace_terminated]
  observable_roles: [return_value, error_code, operation_outcome, output_bytes, output_length, consumed_length, input_length, object_state, state_transition, subsequent_behavior, fatal_event, timing]
  value_types: [integer, boolean, bytes, enum, outcome, state, event, duration]

constraints:
  - divergence records observations only
  - no vulnerability or contract-violation field
  - no target expectation or transfer eligibility field
