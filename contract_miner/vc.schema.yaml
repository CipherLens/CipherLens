schema_version: cipherlens.vc.v0_3
semantic_model: [context, intervention, execution, expected_relation, observable_evidence]
required_top_level: [contract_id, schema_version, contract_family, source, context, intervention, execution, expected_relation, observable_evidence, provenance]
enums:
  contract_families: [input_consumption, failure_output_integrity, object_state_consistency, lifecycle_state, wrapper_error_propagation, resource_memory]
  operation_roles: [INIT, SETUP, UPDATE, FINAL, PARSE, VERIFY, SIGN, QUERY, RESET, REINIT, DUP, COPY, FREE, ABORT]
  object_roles: [encoded_input, stateful_context, key_material, output_buffer, result_object, parameter]
  state_kinds: [initial, intermediate, terminal, error, invalid]
  intervention_kinds: [append_input_tail, set_invalid_parameter, state_reuse_sequence, boundary_value, value_substitution, sequence_replay]
  precondition_predicates: [valid_object_plus_nonempty_external_tail, invalid_pkcs7_padding, same_identifier_equal_nonzero_reuse, invalid_parameter, state_matches]
  relation_types: [outcome_requirement, full_consumption_on_success, output_preserved_on_failure, state_invariant, transition_constraint, failure_propagation, no_fatal_event]
  invariant_ids: [buffer_absent_implies_length_zero]
  observable_roles: [return_value, error_code, operation_outcome, output_bytes, output_length, consumed_length, input_length, object_state, state_transition, subsequent_behavior, fatal_event, timing]
  value_types: [integer, boolean, bytes, enum, outcome, state, event, duration]
  observable_requirements: [required, conditional, optional]
  observable_phases: [before_step, after_step, between_steps, process_end]
  extraction_kinds: [trace_field, out_state_field, process_field, normalized_return, derived]
  normalization_rules: [identity, mbedtls_zero_is_success, parse_result_identity]
  derived_rules: [length_difference]
  evidence_kinds: [patch, diff, poc, root_cause, metadata, regression_test, buggy_run, fixed_run, minimal_witness, advisory]
  derivation_methods: [deterministic, family_rule, structured_metadata, manual]
  producer_modes: [deterministic_family_rule, manual, compatibility_upgrade]
  review_statuses: [reviewed, pending]
  relation_results: [HOLDS, BROKEN, NOT_EVALUABLE]
  source_validation_results: [PASS, FAIL, INCONCLUSIVE, INVALID_INPUT]
  criticalities: [primary, supporting]
  transition_policies: [required, forbidden]
  outcomes: [success, reject]
  evidence_digest: sha256
