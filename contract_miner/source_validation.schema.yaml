schema_version: cipherlens.source_validation.v0_1
required_top_level: [schema_version, validation_id, contract_id, status, reason_codes, source_pair, buggy, fixed, provenance]
enums:
  statuses: [PASS, FAIL, INCONCLUSIVE, INVALID_INPUT]
  relation_results: [HOLDS, BROKEN, NOT_EVALUABLE]
  pair_kinds: [same_library_fix]
meaning:
  PASS: current Contract explains and distinguishes the historical Buggy/Fixed witnesses
  FAIL: evidence contradicts the required historical separation
  INCONCLUSIVE: required witness evidence is insufficient
  INVALID_INPUT: schema, provenance, digest, identity, or pair alignment is invalid
forbidden_results: [SATISFIED, VIOLATED, UNKNOWN]
